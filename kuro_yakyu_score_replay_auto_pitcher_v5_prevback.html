<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>クロ野球 スコア→リプレイ 自動連携版 V5</title>
<style>
html,body{margin:0;height:100%;background:#090909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#app{width:100%;height:100%;border:0;display:block;background:#111}
#badge{position:fixed;right:8px;top:8px;z-index:50;background:#111e;border:1px solid #fff6;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900;pointer-events:none}
#pick{position:fixed;inset:0;z-index:1000;background:#000b;display:none;align-items:center;justify-content:center}
#pick.show{display:flex}
.card{width:min(92vw,430px);background:#171717;border:2px solid #fff;border-radius:14px;padding:14px;box-shadow:0 14px 40px #000}
.card h3{margin:0 0 6px} .card p{font-size:12px;color:#bbb;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
button{border:0;border-radius:9px;background:#087f5b;color:#fff;font-weight:900;padding:12px;font-size:14px}
.gray{background:#555}
#replay{position:fixed;inset:0;z-index:1100;background:#050505;display:none}
#replay.show{display:block}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
.field{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pitcher{position:absolute;width:6.6%;transform:translate(-50%,-50%);z-index:6}
.ball{position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid #d22;transform:translate(-50%,-50%);z-index:8}
.topbar{position:absolute;left:8px;right:8px;top:8px;z-index:20;display:flex;gap:8px;align-items:center}
.topbar button{width:auto;padding:8px 12px;background:#444}
#caption{background:#000d;border:2px solid #fff;padding:7px 12px;font-weight:900;font-size:12px}
#result{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;background:#000d;border:2px solid #fff;padding:8px 14px;font-weight:900;font-size:13px;white-space:nowrap}
@media (orientation:portrait){.stage{height:100%}}

#noReplay{position:fixed;inset:0;z-index:1200;background:#000d;display:none;align-items:center;justify-content:center}
#noReplay.show{display:flex}
#noReplay .card{text-align:center}

</style>
</head>

const frame=document.getElementById('app');
let pending=null, runToken=0;

frame.addEventListener('load',()=>{
  try{
    const w=frame.contentWindow;
    // 投手ゴロだけを横取り。その他のスコア操作は元アプリのまま。
    w.eval(`
      window.__kroOriginalRecordFieldOut = recordFieldOut;
      recordFieldOut = function(){
        const pos=document.getElementById('outPos').value;
        const type=document.getElementById('outType').value;
        if(pos==='投' && type==='ゴロ'){
          save();
          const n=currentBatterName();
          log(n+' 投ゴロ');
          recordPlay('投ゴロ',n);
          playEvents[playEvents.length-1].replayCode='front1';
          doOut();
          render();
          return;
        }
        return window.__kroOriginalRecordFieldOut();
      };
      startReplay = function(){
        parent.kroBridgeStartReplay();
        return false;
      };
      // ===== V5 navigation =====
      // 「スタート」ではなく、本当にひとつ前の画面へ戻る。
      const navStyle=document.createElement('style');
      navStyle.textContent='.kroPrevBtn{position:fixed;left:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9998;width:auto!important;min-width:150px!important;margin:0!important;padding:10px 14px!important;border:2px solid #777!important;border-radius:999px!important;background:#171717!important;color:#fff!important;font-size:13px!important;font-weight:900!important;box-shadow:0 4px 14px #0009!important}.kroPrevBtn:active{transform:scale(.96)}';
      document.head.appendChild(navStyle);

      function kroPrevTarget(){
        const active=document.querySelector('.screen.active');
        if(!active)return '';
        if(active.id==='s2')return 's1'; // スタメン → 試合設定
        if(active.id==='s3')return 's2'; // 試合画面 → スタメン
        return '';
      }
      function kroRenderPrevButton(){
        let btn=document.getElementById('kroPrevBtn');
        const target=kroPrevTarget();
        if(!target){
          if(btn)btn.remove();
          return;
        }
        if(!btn){
          btn=document.createElement('button');
          btn.id='kroPrevBtn';
          btn.className='kroPrevBtn';
          btn.textContent='← 前の画面に戻る';
          btn.onclick=function(){
            const t=kroPrevTarget();
            if(t) show(t);
          };
          document.body.appendChild(btn);
        }
      }

      // 既存 show() は上書きせず、MutationObserverで画面切替だけ監視する。
      const navObserver=new MutationObserver(()=>kroRenderPrevButton());
      document.querySelectorAll('.screen').forEach(el=>{
        navObserver.observe(el,{attributes:true,attributeFilter:['class']});
      });
      kroRenderPrevButton();

      // ===== OLD REPLAY PURGE =====
      // 旧リプレイ画面は「非表示」ではなくDOMから完全削除。
      const oldReplay=document.getElementById('s5');
      if(oldReplay) oldReplay.remove();

      // リプレイボタンも親の新リプレイへ強制接続。
      document.querySelectorAll('.replayLaunch').forEach(btn=>{
        btn.setAttribute('onclick','');
        btn.onclick=function(ev){
          ev&&ev.preventDefault&&ev.preventDefault();
          parent.kroBridgeStartReplay();
          return false;
        };
      });
    `);
    document.getElementById('badge').textContent='⚾ 自動連携 V5 接続OK';
  }catch(e){
    document.getElementById('badge').textContent='⚠ 接続待ち';
    console.error(e);
  }
});


function showNoReplayData(){
  document.getElementById('noReplay').classList.add('show');
}
function closeNoReplay(){
  document.getElementById('noReplay').classList.remove('show');
}

window.kroBridgeStartReplay=function(){
  let events=[];
  try{
    events=frame.contentWindow.eval(`playEvents.map(e=>({
      inning:e.inning,half:e.half,player:e.player,result:e.result,replayCode:e.replayCode||''
    }))`);
  }catch(e){ console.error(e); }
  const targets=events.filter(e=>e.replayCode && ASSETS[e.replayCode]);
  if(!targets.length){
    showNoReplayData();
    return;
  }
  playLinkedReplay(targets);
};

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pos=(el,x,y)=>{el.style.left=x+'%';el.style.top=y+'%'};
async function move(el,a,z,d,k){
  for(let i=0;i<=36;i++){
    if(k!==runToken)return;
    const t=i/36;
    pos(el,a.x+(z.x-a.x)*t,a.y+(z.y-a.y)*t);
    await sleep(d/36);
  }
}
async function playOne(ev,k){
  const p=document.getElementById('pitcher'),b=document.getElementById('ball');
  const cap=document.getElementById('caption'),res=document.getElementById('result');
  const cfg={
    front1:{C:{x:50,y:63},T:{x:82,y:65},name:'正面ゴロ → 一塁送球'},
    right2:{C:{x:57,y:63},T:{x:50,y:37},name:'画面右ゴロ → 二塁送球'},
    right3:{C:{x:57,y:63},T:{x:25,y:58},name:'画面右ゴロ → 三塁送球'}
  }[ev.replayCode];
  const fs=ASSETS[ev.replayCode], M={x:50,y:54};
  cap.textContent=(ev.inning||'')+'回'+(ev.half||'')+'　'+(ev.player||'')+'　'+cfg.name;
  res.textContent='投手ゴロ';
  p.src=fs[0]; pos(p,M.x,M.y); pos(b,50,91); b.style.display='block';
  const roll=move(b,{x:50,y:91},cfg.C,1800,k);
  for(let i=0;i<=12;i++){
    if(k!==runToken)return;
    const t=i/12; pos(p,M.x+(cfg.C.x-M.x)*t,M.y+(cfg.C.y-M.y)*t);
    await sleep(110);
  }
  await roll;if(k!==runToken)return;
  p.src=fs[1];pos(p,cfg.C.x,cfg.C.y);await sleep(650);b.style.display='none';await sleep(220);
  p.src=fs[2];res.textContent='捕球 → 送球';await sleep(620);
  p.src=fs[3];await sleep(420);
  b.style.display='block';pos(b,cfg.C.x+2,cfg.C.y-2);
  await move(b,{x:cfg.C.x+2,y:cfg.C.y-2},cfg.T,1400,k);
  res.textContent='アウト！';
  await sleep(850);
}
async function playLinkedReplay(events){
  const k=++runToken;
  document.getElementById('replay').classList.add('show');
  for(const ev of events){
    if(k!==runToken)return;
    await playOne(ev,k);
    await sleep(350);
  }
  document.getElementById('result').textContent='連携リプレイ終了';
}
function closeReplay(){
  runToken++;
  document.getElementById('replay').classList.remove('show');
}
</script>
