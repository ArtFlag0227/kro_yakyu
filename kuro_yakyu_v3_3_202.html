  function installRunnerGestureLock(doc){
    if(doc.__kuroRunnerGestureLockInstalled)return;
    doc.__kuroRunnerGestureLockInstalled=true;
    const childWindow=doc.defaultView;
    let activePointer=null,releaseLock=null;
    const blockMove=e=>{if(activePointer!==null&&e.cancelable)e.preventDefault();};
    const unlock=()=>{
      if(activePointer===null)return;
      activePointer=null;
      childWindow.removeEventListener('touchmove',blockMove,true);
      childWindow.removeEventListener('pointermove',blockMove,true);
      window.removeEventListener('touchmove',blockMove,true);
      window.removeEventListener('pointermove',blockMove,true);
      doc.documentElement.classList.remove('runner-drag-lock');
      doc.body.classList.remove('runner-drag-lock');
      document.documentElement.classList.remove('runner-drag-lock');
      document.body.classList.remove('runner-drag-lock');
      frame.classList.remove('runner-drag-lock');
      releaseLock?.();releaseLock=null;
    };
    const begin=e=>{
      if(e.currentTarget.id==='battedBallControl'&&!childWindow.canStartBattedBallDrag())return;
      if(activePointer!==null || e.pointerType==='mouse'&&e.button!==0)return;
      activePointer=e.pointerId;
      const scrollY=childWindow.scrollY||doc.documentElement.scrollTop||0;
      const body=doc.body;
      const before={position:body.style.position,top:body.style.top,left:body.style.left,
        right:body.style.right,width:body.style.width,overflow:body.style.overflow};
      doc.documentElement.classList.add('runner-drag-lock');
      body.classList.add('runner-drag-lock');
      document.documentElement.classList.add('runner-drag-lock');
      document.body.classList.add('runner-drag-lock');
      frame.classList.add('runner-drag-lock');
      body.style.position='fixed';body.style.top=(-scrollY)+'px';body.style.left='0';
      body.style.right='0';body.style.width='100%';body.style.overflow='hidden';
      releaseLock=()=>{
        Object.assign(body.style,before);
        try{childWindow.scrollTo(0,scrollY)}catch(_e){}
      };
      childWindow.addEventListener('touchmove',blockMove,{capture:true,passive:false});
      childWindow.addEventListener('pointermove',blockMove,{capture:true,passive:false});
      window.addEventListener('touchmove',blockMove,{capture:true,passive:false});
      window.addEventListener('pointermove',blockMove,{capture:true,passive:false});
    };
    const scheduleUnlock=()=>{const ending=activePointer;if(ending!==null)setTimeout(()=>{if(activePointer===ending)unlock()},0)};
    const end=e=>{if(activePointer===null||e.pointerId!=null&&e.pointerId!==activePointer)return;scheduleUnlock();};
    doc.querySelectorAll('#game .runner,#game #battedBallControl').forEach(runner=>runner.addEventListener('pointerdown',begin,{capture:true,passive:false}));
    childWindow.addEventListener('pointerup',end,{capture:true});
    childWindow.addEventListener('pointercancel',end,{capture:true});
    childWindow.addEventListener('lostpointercapture',end,{capture:true});
    childWindow.addEventListener('touchend',scheduleUnlock,{capture:true});
    childWindow.addEventListener('touchcancel',scheduleUnlock,{capture:true});
    childWindow.addEventListener('kuro-ball-drag-end',unlock);
    childWindow.addEventListener('blur',unlock);
    childWindow.addEventListener('pagehide',unlock);
  }

  function applyFieldFirst(){
    try{

    }catch(e){
      console.error('v125 style injection failed',e);
    }
  }

  frame.addEventListener('load',()=>{
    applyFieldFirst();
    setTimeout(applyFieldFirst,80);

  });
})();
