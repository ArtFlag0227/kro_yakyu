let run=0; const M={x:50,y:54},C={x:50,y:63},ONE={x:82,y:65};
const pos=(e,x,y)=>{e.style.left=x+'%';e.style.top=y+'%'}; const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function move(a,b,ms,id){for(let i=0;i<=40;i++){if(id!==run)return;let t=i/40;pos(ball,a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t);await wait(ms/40)}}
function frame(i){p.src=F[i].src;label.textContent=F[i].label}
function reset(){run++;frame(0);pos(p,M.x,M.y);pos(ball,50,91);ball.style.display='block'}
async function play(){
 const id=++run; frame(0);pos(p,M.x,M.y);pos(ball,50,91);ball.style.display='block';
 // ① 守備：前へ出る。同時にゴロはゆっくり。
 let bm=move({x:50,y:91},C,1800,id);
 for(let s=0;s<=12;s++){if(id!==run)return;pos(p,50,M.y+(C.y-M.y)*(s/12));await wait(110)}
 await bm;if(id!==run)return;
 // ② 捕球
 frame(1);pos(p,C.x,C.y);await wait(700);ball.style.display='none';await wait(250);
 // ③ 一塁送球01
 frame(2);await wait(650);
 // ④ 一塁送球02
 frame(3);await wait(420);
 // ボールを一塁へ、見える速度で
 ball.style.display='block';pos(ball,54,62);await move({x:54,y:62},ONE,1400,id);
}
