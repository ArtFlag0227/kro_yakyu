const pitcher=document.getElementById("pitcher");
const badge=document.getElementById("badge");
let i=0, timer=null, speed=150;

function showFrame(n){
  i=n%frames.length;
  pitcher.src=frames[i];
  badge.textContent="投手"+["①","②","③","④","⑤","⑥","⑦","⑧"][i];
}
function tick(){
  showFrame(i+1);
  timer=setTimeout(tick,speed);
}
function play(){
  stopAnim();
  showFrame(0);
  timer=setTimeout(tick,speed);
}
function stopAnim(){
  if(timer) clearTimeout(timer);
  timer=null;
}
function faster(){
  speed=Math.max(70,speed-20);
  if(timer) play();
}
function slower(){
  speed=Math.min(350,speed+20);
  if(timer) play();
}
showFrame(0);
setTimeout(play,400);
</script>
