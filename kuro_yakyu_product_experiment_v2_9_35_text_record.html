<head>

<title>クロ野球 商品版 土台 v2.9.35 実験版</title>
<style>
*{box-sizing:border-box} :root{--navy:#17324a;--blue:#1769aa;--green:#16824b;--red:#c8443c;--bg:#f2f4f6;--line:#d5dce1;--text:#17212b}
html,body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--text);overscroll-behavior:none;touch-action:manipulation}
.app{width:min(100%,760px);margin:auto;background:#fff;min-height:100vh}
.screen{display:none;padding:14px}.screen.on{display:block}
.hero{text-align:center;padding:44px 8px 26px}.hero .ball{font-size:58px}.hero h1{margin:4px 0;font-size:34px;color:var(--navy)}.muted{color:#6e7880;font-size:13px}
button,input,select{font:inherit;touch-action:manipulation}
.field,.field svg,.runner,.pendingBatter{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.runnerChoice,.runnerChoice button,.fieldBack{touch-action:manipulation}.btn{min-height:48px;border:0;border-radius:11px;font-weight:800;font-size:16px}.wide{width:100%}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.light{background:#e9edf0;color:#25323c}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.head h2{margin:0;color:var(--navy);font-size:22px}
label{display:block;font-size:12px;font-weight:800;margin:9px 0 4px}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav{margin-top:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.tab{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:800}.tab.on{background:var(--navy);color:#fff}
.ph,.pr{display:grid;grid-template-columns:27px minmax(0,1fr) 52px 70px;gap:5px;align-items:center}.ph{font-size:10px;color:#69747c}.pr{margin:5px 0}.pr input,.pr select{min-height:38px;font-size:13px;padding:5px}.ord{text-align:center;font-weight:900}.add{width:100%;min-height:40px;border:1px dashed #9aa4ac;background:#f7f8f9;border-radius:9px;font-weight:800;margin-top:5px}
.gameTop{display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:5px;text-align:center;margin-bottom:5px}.chip{background:#f1f4f6;border-radius:8px;padding:5px 3px;font-size:10px}.chip b{display:block;font-size:14px;color:var(--navy)}
.playersInfo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:5px}.pi{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:10px}.pi b{font-size:13px}
.field{position:relative;width:100%;aspect-ratio:1.22/1;max-height:52vh;overflow:hidden;border-radius:14px;background:#72b86d;touch-action:none;border:1px solid #b8c8b6;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
.fieldBack{position:absolute;left:8px;top:8px;z-index:45;border:1px solid #ffffffcc;background:#ffffffdd;color:#263746;border-radius:10px;padding:5px 10px;font-weight:900;font-size:13px;line-height:1.2;min-height:30px;box-shadow:0 1px 4px #0003}.fieldBack:active{transform:scale(.97)}
.field svg{width:100%;height:100%;display:block;position:relative;z-index:1}.runner{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);border:3px solid white;box-shadow:0 1px 3px #0004;transform:translate(-50%,-50%);display:none;touch-action:none;cursor:grab;z-index:30;color:#fff;pointer-events:auto;font-weight:900;font-size:15px;line-height:1;align-items:center;justify-content:center;text-align:center}.runner.dragging{cursor:grabbing;opacity:.95}
.runner.pending{background:#d43d35;box-shadow:0 0 0 4px #d43d3533}
.pendingBatter{position:absolute;width:30px;height:30px;border-radius:50%;background:#d43d35;border:3px solid #fff;box-shadow:0 1px 4px #0005;transform:translate(-50%,-50%);display:none;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;z-index:31;touch-action:manipulation}
.controls{display:flex;justify-content:center;gap:4px;margin-top:5px;flex-wrap:nowrap}
.play{width:48px;min-height:34px;padding:2px 4px;border:1px solid #2470b7;border-radius:7px;background:#2f80c9;color:#fff;font-weight:900;font-size:13px;box-shadow:0 1px 2px #0002}
.play.locked{background:#c4c9cd;color:#f7f7f7;border-color:#b5bbc0;box-shadow:none;opacity:1;filter:none;pointer-events:none}
.play.active{background:var(--navy);color:#fff}
.bottomBar{display:grid;grid-template-columns:68px 1fr 56px;gap:5px;margin-top:5px}.icon{min-height:42px;border:0;border-radius:9px;background:#e9edf0;font-size:19px}.ok{background:#aeb6bc;color:#fff;font-weight:900;border:0;border-radius:9px;transition:.15s}.ok.ready{background:#d43d35;box-shadow:0 0 0 2px #d43d3522}.undo{border:0;border-radius:9px;background:#e9edf0;font-weight:800}
.choice{display:none;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:5px}.choice.on{display:grid}.choice button{min-height:40px;border:0;border-radius:8px;background:#e9edf0;font-weight:800}
.runnerChoice{position:absolute;z-index:100;display:none;gap:3px;transform:translate(-50%,-100%);padding-bottom:7px;white-space:nowrap;pointer-events:auto;touch-action:manipulation}
.runnerChoice.on{display:flex}
.runnerChoice button{min-height:30px;padding:3px 9px;border:0;border-radius:7px;background:#fff;box-shadow:0 1px 5px #0004;font-size:11px;font-weight:900;pointer-events:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.runnerChoice:after{content:"";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #fff}
.status{text-align:center;font-size:11px;color:#59656e;min-height:18px;padding-top:3px}
.textPage textarea{width:100%;height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px}
@media(min-width:650px){.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(240px,.65fr);gap:10px}.rightPanel{align-self:start}.field{max-height:none}.play{width:52px;min-height:36px}}

.play.line-locked{opacity:.35;pointer-events:none;filter:grayscale(1)}

/* v2.9.35: 三振種別を一目で区別 */
.runnerChoice button.k-swing{
  background:#e53935 !important;
  color:#fff !important;
  border-color:#b71c1c !important;
  font-weight:900;
}
.runnerChoice button.k-looking{
  background:#ffb300 !important;
  color:#111 !important;
  border-color:#e08b00 !important;
  font-weight:900;
}


.choice button.k-swing{
  background:#e53935 !important;
  color:#fff !important;
  font-weight:900;
}
.choice button.k-looking{
  background:#ffb300 !important;
  color:#111 !important;
  font-weight:900;
}


.play.locked-by-runner{
  opacity:.35 !important;
  pointer-events:none !important;
  filter:grayscale(1);
}
</style>

<script>
const $=q=>document.querySelector(q),$$=q=>document.querySelectorAll(q);function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}
let d=new Date();$('#date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pos=['投','捕','一','二','三','遊','左','中','右','DH','控'];
const ROSTER_KEY='kuroYakyuRosterV1';
let side='my';

function blankRoster(){
  const d={my:[],opp:[]};
  for(const s of ['my','opp']){
    for(let i=0;i<9;i++) d[s].push({name:'',no:'',pos:pos[i]});
  }
  return d;
}
function loadRoster(){
  try{
    const saved=JSON.parse(localStorage.getItem(ROSTER_KEY)||'null');
    if(saved && Array.isArray(saved.my) && Array.isArray(saved.opp)) return saved;
  }catch(e){}
  return blankRoster();
}
let data=loadRoster();

function persistRoster(){
  try{ localStorage.setItem(ROSTER_KEY,JSON.stringify(data)); }catch(e){}
}
function esc(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function save(){
  [...$('#plist').children].forEach((r,i)=>{
    data[side][i]={
      name:r.querySelector('.nm').value.trim(),
      no:r.querySelector('.no').value.trim(),
      pos:r.querySelector('.po').value
    };
  });
  persistRoster();
}
function render(){
  let l=$('#plist');l.innerHTML='';
  data[side].forEach((p,i)=>{
    let r=document.createElement('div');r.className='pr';
    r.innerHTML='<span class="ord">'+(i+1)+'</span>'+
      '<input class="nm" value="'+esc(p.name)+'" placeholder="選手名">'+
      '<input class="no" inputmode="numeric" value="'+esc(p.no)+'" placeholder="No.">'+
      '<select class="po">'+pos.map(v=>'<option '+(v===p.pos?'selected':'')+'>'+v+'</option>').join('')+'</select>';
    l.appendChild(r);
  });
  l.querySelectorAll('input,select').forEach(el=>{
    el.addEventListener('change',save);
    el.addEventListener('blur',save);
  });
}
$('#start').onclick=()=>show('setup');$('#backTitle').onclick=()=>show('title');$('#toPlayers').onclick=()=>{render();show('players')};$('#backSetup').onclick=()=>{save();show('setup')};
$('#backPlayers').onclick=()=>{save();show('players')};
$$('.tab').forEach(t=>t.onclick=()=>{save();side=t.dataset.side;$$('.tab').forEach(z=>z.classList.toggle('on',z===t));render()});
$('#add').onclick=()=>{save();data[side].push({name:'',no:'',pos:'控'});persistRoster();render()};
let batterIndex=0;
let bases=[null,null,null]; // 0=一塁,1=二塁,2=三塁
let currentBatter=null;
let playOpen=false;
let atBatResultReady=false;
let playHistory=[];
function cloneObj(v){return v==null?v:JSON.parse(JSON.stringify(v))}
function capturePlayState(){
  const ln=drawnLines.length?drawnLines[drawnLines.length-1]:null;
  return {
    batterIndex,
    bases:cloneObj(bases),
    currentBatter:cloneObj(currentBatter),
    playOpen,
    atBatResultReady,
    outs:$('#outs').textContent,
    score:$('#score').textContent,
    line:ln?{x1:ln.getAttribute('x1'),y1:ln.getAttribute('y1'),x2:ln.getAttribute('x2'),y2:ln.getAttribute('y2')}:null,
    lineLocked,
    lastBattedBall:cloneObj(lastBattedBall)
  };
}
function pushPlayState(){const st=capturePlayState();st.line=null;st.lineLocked=false;
 updateLineLocks();st.lastBattedBall=null;playHistory.push(st);if(playHistory.length>50)playHistory.shift()}
function restorePlayState(st){
  cancelRunnerChoiceTimer();hideRunnerChoice();choice.classList.remove('on');
  batterIndex=st.batterIndex;bases=cloneObj(st.bases);currentBatter=cloneObj(st.currentBatter);playOpen=st.playOpen;
  $('#outs').textContent=st.outs;$('#score').textContent=st.score;
  drawLayer.innerHTML='';drawnLines=[];currentLine=null;drawing=false;
  if(st.line){
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    for(const k of ['x1','y1','x2','y2'])ln.setAttribute(k,st.line[k]);
    ln.setAttribute('stroke','#17212b');ln.setAttribute('stroke-width','7');ln.setAttribute('stroke-linecap','round');
    drawLayer.appendChild(ln);drawnLines.push(ln);
  }
  lineLocked=st.lineLocked;lastBattedBall=cloneObj(st.lastBattedBall);
  setAtBatReady(st.atBatResultReady);updateBatter();syncRunners();
}

function lineup(){return data.my.length?data.my:[{name:''}]}
function batterPlayer(){return lineup()[batterIndex%lineup().length]||{name:'選手'+(batterIndex+1),no:''}}
function batterName(){return batterPlayer().name||('選手'+(batterIndex+1))}
function batterNo(){return String(batterPlayer().no||'').trim()}
function updateBatter(){
  const list=lineup();
  const idx=batterIndex%list.length;
  const p=list[idx];
  $('#batter').textContent=(idx+1)+'. '+(p?.name||'選手')+'  ('+(idx+1)+'/'+list.length+')';
}
function setAtBatReady(v){
  atBatResultReady=!!v;
  $('#ok').classList.toggle('ready',atBatResultReady);
  $('#ok').setAttribute('aria-disabled',atBatResultReady?'false':'true');
  $('#ok').textContent='OK';

function placeExtraBaseHit(kind){

  }

  let runs=0;
  for(let i=0;i<3;i++){

  if(dx<=70)  return {zone:'CF',label:'センター'};

}

  runner.style.top=basePos[to].top+'%';
  status.textContent=basePos[to].label+'に到達…';

  runnerChoiceTimer=setTimeout(()=>{
    runnerChoiceTimer=null;
    runnerChoice.innerHTML='';
    runnerChoice.style.left=basePos[to].left+'%';
    runnerChoice.style.top=basePos[to].top+'%';

    const moving=bases[from];
    const add=(label,fn)=>{
      const b=document.createElement('button');
      b.textContent=label;
    if(label==='空振り') b.classList.add('k-swing');
    if(label==='見逃し') b.classList.add('k-looking');
      b.onclick=()=>{ cancelRunnerChoiceTimer(); fn(); hideRunnerChoice(); };
      runnerChoice.appendChild(b);
    };

    // H後の打者走者を動かした時は、到達塁に応じて打撃結果を確認。
    if(from===0 && moving?.isCurrentBatter && moving?.kind==='H' && (to===1 || to===2)){
      if(to===1){
        add('2B',()=>{
          if(!bases[1]){
            bases[1]=bases[0]; bases[0]=null; bases[1].kind='2B';
            syncRunners(); status.textContent=extraBaseLabel('2B')+'として記録';
          }
        });
      }else{
        add('3B',()=>{
          if(!bases[2]){
            bases[2]=bases[0]; bases[0]=null; bases[2].kind='3B';
            syncRunners(); status.textContent=extraBaseLabel('3B')+'として記録';
          }
        });
      }
      add('H＋進塁',()=>{
        if(!bases[to]){
          bases[to]=bases[0]; bases[0]=null; bases[to].kind='H+ADV';
          syncRunners(); status.textContent='単打＋進塁として記録';
        }
      });
      add('OUT',()=>{
        cancelRunnerChoiceTimer();
        bases[from]=null;
        addOut('走塁OUT');
        syncRunners();
        hideRunnerChoice();
        status.textContent='走者OUT：アウトカウント＋1';
      });
    }else if(to===3){
      add('得点',()=>settleRunnerSafe(from,to));
      add('OUT',()=>{
        cancelRunnerChoiceTimer();
        bases[from]=null;
        addOut('走塁OUT');
        syncRunners();
        hideRunnerChoice();
        status.textContent='走者OUT：アウトカウント＋1';
      });
    }else{
      add('進塁',()=>settleRunnerSafe(from,to,'進塁'));
      add('盗塁',()=>settleRunnerSafe(from,to,'盗塁'));
      add('OUT',()=>{
        cancelRunnerChoiceTimer();
        bases[from]=null;
        addOut('走塁OUT');
        syncRunners();
        hideRunnerChoice();
        status.textContent='走者OUT：アウトカウント＋1';
      });
      add('その他',()=>{
        settleRunnerSafe(from,to,'その他');
      });
    }
    runnerChoice.classList.add('on');
    status.textContent='結果を選択';
  },1000);
}

function showErrorFielderChoice(){

function finishPendingExtraBase(kind){
  if(!pendingPlay || !pendingBatter.classList.contains('pending')) return false;

  // 赤い仮表示だけ解除。basesの実データはそのまま使って長打処理する。
  pendingBatter.classList.remove('pending');
  pendingBatter.style.display='none';
  runners.forEach(r=>r.classList.remove('pending'));
  pendingRunnerQueue=[];
  pendingKind=null;
  pendingPlay=false;
  hideRunnerChoice();

  if(kind==='HR'){
    const runnerCount=bases.filter(Boolean).length;
    const runs=runnerCount+1;
    for(let i=0;i<runs;i++) addRun();
    bases=[null,null,null];
    currentBatter=null;
    playOpen=true;
    syncRunners();
    setAtBatReady(true);
    status.textContent='HR：'+runs+'得点。走者と打者を自動で生還';
  }else{
    placeExtraBaseHit(kind);
  }

  updateExistingRunnerLocks();
  updatePendingLocks();
  return true;
}

function finishPendingBatter(kind){
  if(!pendingPlay || !pendingBatter.classList.contains('pending')) return false;

  pendingBatter.classList.remove('pending');
  pendingBatter.style.display='none';
  runners.forEach(r=>r.classList.remove('pending'));
  pendingRunnerQueue=[];
  pendingKind=null;
  pendingPlay=false;

  if(kind==='FC'){
    currentBatter={
      name:batterName(),
      no:batterNo(),
      order:String((batterIndex%lineup().length)+1),
      kind:'FC',
      isCurrentBatter:true
    };
    bases[0]=currentBatter;
    syncRunners();
    playOpen=true;
    status.textContent='FC：打者は一塁セーフ。OKで次打者へ';
  }else if(kind==='H'){
    placeBatterOnFirst('H');
    status.textContent=hitLabel()+'：打者一塁。OKで次打者へ';
  }else if(kind==='ゴロ'){
    addOut('ゴロ');
    playOpen=true;
    status.textContent='ゴロ：打者OUT。OKで次打者へ';
  }else if(kind==='フライ'){
    addOut('フライ');
    playOpen=true;
    status.textContent='フライ：打者OUT。OKで次打者へ';
  }else if(kind==='ライナー'){
    addOut('ライナー');
    playOpen=true;
    status.textContent='ライナー：打者OUT。OKで次打者へ';
  }else if(kind==='E'){
    placeBatterOnFirst('E');
    status.textContent='E：打者一塁。OKで次打者へ';
  }

  setAtBatReady(true);
  updatePendingLocks();
  ensurePendingReady();
  requestAnimationFrame(()=>{ setAtBatReady(true); ensurePendingReady(); });
  return true;
}

function showPendingDecision(el,label){
 if(!pendingPlay)return;
 const r=el.getBoundingClientRect(),f=fieldEl.getBoundingClientRect();
 runnerChoice.innerHTML='';
 runnerChoice.style.left=((r.left+r.width/2-f.left)/f.width*100)+'%';
 runnerChoice.style.top=((r.top-f.top)/f.height*100)+'%';
 if(el===pendingBatter){
   const add=(l,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();hideRunnerChoice();fn();});runnerChoice.appendChild(b)};
   if(forceOutAtSecond){
     add('FC',()=>finishPendingBatter('FC'));
     add('OUT',()=>finishPendingBatter('ゴロ'));
     add('E',()=>showErrorFielderChoice());
   }else if(returnToBaseOnly){
     add('フライ',()=>finishPendingBatter('フライ'));
     add('ライナー',()=>finishPendingBatter('ライナー'));
     add('E',()=>showErrorFielderChoice());
   }else{
     add('H',()=>finishPendingBatter('H'));
     add('ゴロ',()=>finishPendingBatter('ゴロ'));
     add('フライ',()=>finishPendingBatter('フライ'));
     add('E',()=>showErrorFielderChoice());
   }
   runnerChoice.classList.add('on');
   status.textContent=forceOutAtSecond
     ? '打者走者：FC / OUT / E'
     : (returnToBaseOnly ? '打者走者：フライ / ライナー / E' : '打者走者：H / ゴロ / フライ / E');
   return;
 }
}
pendingBatter.addEventListener('pointerup',ev=>{ev.preventDefault();ev.stopPropagation();showPendingDecision(pendingBatter,'打者走者')});
runnerChoice.addEventListener('pointerdown',ev=>ev.stopPropagation());
runnerChoice.addEventListener('pointermove',ev=>ev.stopPropagation());
runnerChoice.addEventListener('pointerup',ev=>ev.stopPropagation());


function attachRunner(runner,index){
 runner.addEventListener('pointerdown',ev=>{
   if(pendingPlay&&runner.classList.contains('pending')){ev.preventDefault();ev.stopPropagation();showPendingRunnerDecision(index);return;}

   if(!bases[index])return;
   ev.preventDefault();ev.stopPropagation();
   drawing=false;currentLine=null;
   cancelRunnerChoiceTimer();hideRunnerChoice();
   runner.setPointerCapture(ev.pointerId);
   runnerDrag={runner,index,startLeft:runner.style.left,startTop:runner.style.top,lastX:ev.clientX,lastY:ev.clientY};
   runner.classList.add('dragging');
 });
 runner.addEventListener('pointermove',ev=>{
   if(!runnerDrag||runnerDrag.runner!==runner)return;
   ev.preventDefault();ev.stopPropagation();
   const p=fieldPercent(ev);
   runner.style.left=p.x+'%';runner.style.top=p.y+'%';
 });
 runner.addEventListener('pointerup',ev=>{
   if(!runnerDrag||runnerDrag.runner!==runner)return;
   ev.preventDefault();ev.stopPropagation();
   runner.classList.remove('dragging');

   const p=fieldPercent(ev);
   const from=index;

   // 元の塁より先なら、二塁を飛ばして三塁などにも直接置ける。
   let to=-1,best=999;
   for(let i=from+1;i<basePos.length;i++){
     const dist=Math.hypot(p.x-basePos[i].left,p.y-basePos[i].top);
     if(dist<best){best=dist;to=i;}
   }
   if(to<0 || best>18){
     syncRunners();
     status.textContent=basePos[from].label+'走者：到達する塁へドラッグ';
     runnerDrag=null;
     return;
   }

   runnerDrag=null;
   delayedChoices(runner,from,to);
 });
 runner.addEventListener('pointercancel',()=>{
   cancelRunnerChoiceTimer();
   runnerDrag=null;
   runner.classList.remove('dragging');
   syncRunners();
 });
}
runners.forEach(attachRunner);

$('#undo').onclick=()=>{
 cancelRunnerChoiceTimer();hideRunnerChoice();choice.classList.remove('on');clearPendingPreview();
 const st=playHistory.pop();
 if(st){restorePlayState(st);status.textContent='一つ前のプレーに戻しました';return;}

$('#ok').onclick=()=>{
  if(!atBatResultReady){

    return;
  }

  if(Number($('#outs').textContent||0)>=3){

};

// v2.9.35: 全ボタン共通の低い鈍音。
let buttonAudioCtx=null;
function playButtonSound(){
  try{
    if(!buttonAudioCtx){
      buttonAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }
    if(buttonAudioCtx.state==='suspended') buttonAudioCtx.resume();

    const ctx=buttonAudioCtx;
    const now=ctx.currentTime;

    const master=ctx.createGain();
    master.gain.setValueAtTime(0.0001,now);
    master.gain.exponentialRampToValueAtTime(0.95,now+0.006);
    master.gain.exponentialRampToValueAtTime(0.0001,now+0.22);

    const lowpass=ctx.createBiquadFilter();
    lowpass.type='lowpass';
    lowpass.frequency.setValueAtTime(380,now);
    lowpass.Q.setValueAtTime(0.7,now);
    master.connect(lowpass);
    lowpass.connect(ctx.destination);

    [[120,'sine',0.85],[175,'triangle',0.35]].forEach(([freq,type,level])=>{
      const osc=ctx.createOscillator();
      const g=ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(freq,now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(70,freq*0.72),now+0.20);
      g.gain.setValueAtTime(level,now);
      g.gain.exponentialRampToValueAtTime(0.0001,now+0.21);
      osc.connect(g);
      g.connect(master);
      osc.start(now);
      osc.stop(now+0.22);
    });
  }catch(e){}
}

// 動的に後から作られる選択肢ボタンも含め、全buttonに音を付ける。
// clickのcaptureで鳴らすので既存のonclick処理は変更しない。
document.addEventListener('click',e=>{
  const btn=e.target.closest('button');
  if(!btn) return;
  if(btn.disabled) return;
  playButtonSound();
},true);

<script id="kuroTextInputScript">
(()=>{
 const modal=document.getElementById('textPlayModal'), input=document.getElementById('textPlayInput'),
 result=document.getElementById('textPlayResult'), apply=document.getElementById('textApply');
 let parsed=null;

 function normalize(s){
   return s.replace(/[　\s]+/g,' ').trim()
    .replace(/ホームイン|生還|帰った|かえった/g,'得点')
    .replace(/フォアボール|四球/g,'四球')
    .replace(/デッドボール|死球/g,'死球')
    .replace(/三振した|三振/g,'三振')
    .replace(/センター/g,'中').replace(/レフト/g,'左').replace(/ライト/g,'右')
    .replace(/ショート/g,'遊').replace(/セカンド/g,'二').replace(/サード/g,'三')
    .replace(/ファースト/g,'一').replace(/ピッチャー/g,'投').replace(/キャッチャー/g,'捕');
 }
 function parsePlay(raw){
   const s=normalize(raw), out={raw, normalized:s, batter:null, direction:null, error:null, outs:[], moves:[], uncertain:[]};
   if(/見逃し.*三振|三振.*見逃し/.test(s)) out.batter='見逃し三振';
   else if(/空振り.*三振|三振.*空振り/.test(s)) out.batter='空振り三振';
   else if(/三振/.test(s)) out.batter='三振';
   else if(/四球/.test(s)) out.batter='四球';
   else if(/死球/.test(s)) out.batter='死球';
   else if(/本塁打|ホームラン|HR/i.test(s)) out.batter='HR';
   else if(/三塁打|3B/i.test(s)) out.batter='3B';
   else if(/二塁打|2B/i.test(s)) out.batter='2B';
   else if(/ヒット|安打|前に抜け|間を抜け|前に落ち/.test(s)) out.batter='H';
   else if(/ゴロ/.test(s)) out.batter='ゴロ';
   else if(/フライ|飛球/.test(s)) out.batter='フライ';
   else if(/ライナー|直球/.test(s)) out.batter='ライナー';

   const dirs=[['投','投手'],['捕','捕手'],['一','一塁'],['二','二塁'],['三','三塁'],['遊','遊撃'],['左','左翼'],['中','中堅'],['右','右翼']];
   for(const [k,v] of dirs){ if(s.includes(k)){ out.direction=v; break; } }

   if(/エラー|失策|落球|悪送球/.test(s)){
     out.error=true;
     const m=s.match(/(投|捕|一|二|三|遊|左|中|右).{0,5}(エラー|失策|落球|悪送球)/);
     if(m) out.errorFielder=m[1];
   }

   const runnerNames=[['一塁走者',1],['二塁走者',2],['三塁走者',3]];
   for(const [name,base] of runnerNames){
     const idx=s.indexOf(name);
     if(idx>=0){
       const part=s.slice(idx, idx+28);
       if(/得点|ホーム/.test(part)) out.moves.push({runner:base,to:'HOME',result:'SAFE'});
       else if(/三塁/.test(part)) out.moves.push({runner:base,to:3,result:/アウト/.test(part)?'OUT':'SAFE'});
       else if(/二塁/.test(part)) out.moves.push({runner:base,to:2,result:/アウト/.test(part)?'OUT':'SAFE'});
       else if(/一塁/.test(part)) out.moves.push({runner:base,to:1,result:/アウト/.test(part)?'OUT':'SAFE'});
       if(/アウト/.test(part) && !out.moves.some(x=>x.runner===base)) out.outs.push('走者'+base+'塁');
     }
   }
   if(/打者.{0,12}一塁/.test(s)) out.moves.push({runner:'B',to:1,result:/打者.{0,15}アウト/.test(s)?'OUT':'SAFE'});
   if(/打者.{0,12}二塁/.test(s)) out.moves.push({runner:'B',to:2,result:'SAFE'});
   if(/打者.{0,12}三塁/.test(s)) out.moves.push({runner:'B',to:3,result:'SAFE'});
   if(/打者.{0,15}アウト/.test(s)) out.outs.push('打者');
   if(/フォースアウト/.test(s) && !out.outs.length) out.outs.push('フォースアウト');

   if(!out.batter) out.uncertain.push('打者結果');
   if(out.error && !out.errorFielder) out.uncertain.push('誰のエラーか');
   return out;
 }
 function summary(o){
   const rows=[];
   rows.push('<b>読み取り結果</b>');
   rows.push('打者：'+(o.batter||'？'));
   if(o.direction) rows.push('方向：'+o.direction);
   if(o.error) rows.push('エラー：'+(o.errorFielder||'守備位置未確定'));
   o.moves.forEach(m=>rows.push((m.runner==='B'?'打者':m.runner+'塁走者')+' → '+m.to+' '+m.result));
   o.outs.forEach(x=>rows.push('OUT：'+x));
   if(o.uncertain.length) rows.push('<b>確認が必要：</b>'+o.uncertain.join('、'));
   return rows.join('<br>');
 }
 function open(){
   parsed=null;
   input.value='';
   result.innerHTML='';
   result.classList.remove('on');
   apply.classList.remove('on');
   modal.classList.add('on');
   setTimeout(()=>input.focus(),60);
 }
 function close(){ modal.classList.remove('on'); }

 // Existing pencil/text button: accept several likely selectors without disturbing other buttons.
 document.addEventListener('click',e=>{
   const b=e.target.closest('button');
   if(!b) return;
   const t=(b.textContent||'').trim();
   if(t==='✏️'||t==='📝'||t==='文章'||t==='文字'){ e.preventDefault(); open(); }
 },true);
 const cancelBtn=document.getElementById('textCancel');
 const analyzeBtn=document.getElementById('textAnalyze');
 let analyzeTimer=null;

 function analyzeNow(){
   const value=input.value.trim();
   if(!value){
     parsed=null;
     result.classList.remove('on');
     apply.classList.remove('on');
     return;
   }
   parsed=parsePlay(value);
   result.innerHTML=summary(parsed);
   result.classList.add('on');
   apply.classList.add('on');
 }

 cancelBtn.addEventListener('click',close);
 analyzeBtn.addEventListener('click',analyzeNow);

 // 文字を入れたら自動で読み取る。ボタンを押さなくても結果が出る。
 input.addEventListener('input',()=>{
   clearTimeout(analyzeTimer);
   analyzeTimer=setTimeout(analyzeNow,180);
 });

 apply.addEventListener('click',()=>{
   if(!parsed) return;
   // v2.9.35は安全第一：解析結果を確認できるところまで。

<script id="textRecordHelpers">

<script id="mainTextPageParser">
(()=>{
 const input=document.getElementById('mainTextPlayInput');
 const result=document.getElementById('mainTextPlayResult');
 const btn=document.getElementById('textOk');
 if(!input||!result||!btn) return;
 let timer=null;
 try{ window.kuroTextPlayEvents=JSON.parse(localStorage.getItem('kuroYakyuTextEventsV1')||'[]'); }
 catch(e){ window.kuroTextPlayEvents=[]; }

 const norm=s=>s.replace(/[　\s]+/g,' ').trim()
   .replace(/ホームイン|生還|帰った|還った/g,'得点')
   .replace(/フォアボール/g,'四球').replace(/デッドボール/g,'死球')
   .replace(/ショート/g,'遊撃').replace(/セカンド/g,'二塁手')
   .replace(/サード/g,'三塁手').replace(/ファースト/g,'一塁手')
   .replace(/ピッチャー/g,'投手').replace(/キャッチャー/g,'捕手')
   .replace(/センター/g,'中堅').replace(/レフト/g,'左翼').replace(/ライト/g,'右翼');

 function batterResult(s){
   if(/見逃し.{0,4}三振|三振.{0,4}見逃し/.test(s)) return '見逃し三振';
   if(/空振り.{0,4}三振|三振.{0,4}空振り/.test(s)) return '空振り三振';
   if(/三振/.test(s)) return '三振';
   if(/四球/.test(s)) return '四球';
   if(/死球/.test(s)) return '死球';
   if(/本塁打|ホームラン|HR/i.test(s)) return 'HR';
   if(/三塁打|3B/i.test(s)) return '3B';
   if(/二塁打|2B/i.test(s)) return '2B';
   if(/ヒット|安打|前に抜け|間を抜け|前に落ち/.test(s)) return 'H';
   if(/ゴロ/.test(s)) return 'ゴロ';
   if(/フライ|飛球/.test(s)) return 'フライ';
   if(/ライナー/.test(s)) return 'ライナー';
   return null;
 }
 function direction(s){
   const a=[
    [/中堅|中前/,'中堅'],[/左翼|左前/,'左翼'],[/右翼|右前/,'右翼'],
    [/遊撃/,'遊撃'],[/二塁手/,'二塁'],[/三塁手/,'三塁'],[/一塁手/,'一塁'],
    [/投手/,'投手'],[/捕手/,'捕手']
   ];
   for(const [r,n] of a) if(r.test(s)) return n;
   return '';
 }
 function runnerEvents(s){
   const events=[];
   const specs=[['一塁走者',1],['二塁走者',2],['三塁走者',3]];
   for(const [label,from] of specs){
     const i=s.indexOf(label);
     if(i<0) continue;
     const part=s.slice(i,i+42);
     if(/得点|ホーム/.test(part)) events.push({who:label,to:'HOME',result:/アウト/.test(part)&&/ホーム.{0,10}アウト/.test(part)?'OUT':'SAFE'});
     else {
       const dest=part.match(/(一|二|三|1|2|3)塁/);
       if(dest){
         const map={一:1,二:2,三:3,'1':1,'2':2,'3':3};
         const to=map[dest[1]];
         if(to!==from) events.push({who:label,to:to+'塁',result:/アウト/.test(part)?'OUT':'SAFE'});
       }
       if(/戻|帰塁/.test(part)) events.push({who:label,to:from+'塁',result:'帰塁'});
     }
   }
   const batterWords=['打者走者','バッターランナー','バッター','打者'];
   let bi=-1; for(const w of batterWords){ const j=s.indexOf(w); if(j>=0 && (bi<0 || j<bi)) bi=j; }
   if(bi>=0){
     const p=s.slice(bi,bi+38);
     if(/アウト/.test(p)) events.push({who:'打者',to:'—',result:'OUT'});
     else {
       const d=p.match(/(一|二|三|1|2|3)塁/);
       if(d){
         const map={一:1,二:2,三:3,'1':1,'2':2,'3':3};
         events.push({who:'打者',to:map[d[1]]+'塁',result:'SAFE'});
       }else if(/セーフ/.test(p)){
         // 単に「バッターセーフ」なら通常の打者走者到達塁＝一塁として扱う
         events.push({who:'打者',to:'一塁',result:'SAFE'});
       }
     }
   }
   return events;
 }
 function analyze(){
   const raw=input.value.trim();
   if(!raw){result.style.display='none';result.innerHTML='';return;}
   const s=norm(raw), batter=batterResult(s), dir=direction(s), ev=runnerEvents(s);
   const lines=['<b>読み取り結果</b>','打者：'+(batter||'？')];
   if(dir) lines.push('方向：'+dir);

   const error=/エラー|失策|落球|悪送球/.test(s);
   if(error){
     let who='';
     const em=s.match(/(投手|捕手|一塁手|二塁手|三塁手|遊撃|左翼|中堅|右翼).{0,8}(エラー|失策|落球|悪送球)/);
     if(em) who=em[1];
     lines.push('エラー：'+(who||'守備位置未確定'));
   }

   if(/フォースアウト/.test(s)){
     lines.push('判定：フォースOUT');
     if(/(打者走者|バッターランナー|バッター|打者).{0,18}(セーフ|一塁|1塁)/.test(s)) lines.push('打者結果：FC（野手選択）');
   }
   if(/ダブルプレー|併殺|ゲッツー/.test(s)) lines.push('判定：ダブルプレー');
   if(/タッチアップ/.test(s)) lines.push('走塁：タッチアップ');
   if(/盗塁/.test(s)) lines.push('走塁：盗塁');
   ev.forEach(e=>lines.push(e.who+' → '+e.to+' '+e.result));

   const need=[];
   if(!batter) need.push('打者結果');
   if(error && !/(投手|捕手|一塁手|二塁手|三塁手|遊撃|左翼|中堅|右翼).{0,8}(エラー|失策|落球|悪送球)/.test(s)) need.push('誰のエラーか');
   if(/二人|2人/.test(s) && /得点/.test(s) && ev.filter(e=>e.to==='HOME').length<2) need.push('どの走者が得点したか');
   if(need.length) lines.push('<b>確認が必要：</b>'+need.join('、'));

   result.innerHTML=lines.join('<br>');
   result.style.display='block';
 }
 input.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(analyze,120);});
 


})();
</script>


<script id="directTextRecorder">
function recordMainTextPlay(){
  if(window.__kuroTextRecording) return;
  window.__kuroTextRecording=true;
  const input=document.getElementById('mainTextPlayInput');
  const result=document.getElementById('mainTextPlayResult');
  const raw=(input?.value||'').trim();
  if(!raw){ window.__kuroTextRecording=false; return; }

  result.style.display='block';
  result.innerHTML += '<br><b>記録処理：</b>開始';

  const s=raw.replace(/[　\s]+/g,' ').trim()
    .replace(/ショート/g,'遊撃').replace(/センター/g,'中堅')
    .replace(/レフト/g,'左翼').replace(/ライト/g,'右翼')
    .replace(/セカンド/g,'二塁手').replace(/サード/g,'三塁手')
    .replace(/ファースト/g,'一塁手')
    .replace(/バッターランナー/g,'打者走者').replace(/バッター/g,'打者')
    .replace(/ホームイン|生還|帰った|還った/g,'得点');

  const forceAtSecond=/(二塁|2塁)[^、。]{0,20}フォース(アウト|OUT)/i.test(s);
  const batterSafe=/(打者走者|打者)[^、。]{0,24}セーフ/i.test(s);

  // 単打の言い回し。方向だけでも「○○前」「○○間を抜けた」なら単打として扱う。
  const isSingleHit=/(ヒット|安打|中堅前|中前|左翼前|左前|右翼前|右前|三遊間.{0,8}抜|一二塁間.{0,8}抜|二遊間.{0,8}抜)/.test(s)
    && !/(二塁打|2塁打|ツーベース|三塁打|3塁打|スリーベース|ホームラン|HR)/i.test(s);

  function saveUndo(){
    if(typeof capturePlayState==='function' && Array.isArray(playHistory)){
      playHistory.push(capturePlayState());
      if(playHistory.length>50) playHistory.shift();
    }
  }
  function makeBatter(kind){
    const len=lineup().length||1;
    return {name:batterName(),no:batterNo(),order:String((batterIndex%len)+1),kind,isCurrentBatter:true};
  }
  function addOutDirect(n=1){
    const el=document.getElementById('outs');
    el.textContent=String(Math.min(3,(Number(el.textContent)||0)+n));
  }
  function addRunsDirect(n=1){
    for(let i=0;i<n;i++) if(typeof addRun==='function') addRun();
  }
  function finishRecord(message,eventData){
    currentBatter=eventData.batterObj||currentBatter;
    playOpen=true;
    if(typeof syncRunners==='function') syncRunners();
    if(typeof updateBatter==='function') updateBatter();
    // updateBatter() can reset the ready state, so OK-ready must be applied last.
    if(typeof setAtBatReady==='function') setAtBatReady(true);

    window.kuroTextPlayEvents=window.kuroTextPlayEvents||[];
    const stored={...eventData}; delete stored.batterObj;
    stored.raw=raw; stored.timestamp=Date.now();
    window.kuroTextPlayEvents.push(stored);
    try{localStorage.setItem('kuroYakyuTextEventsV1',JSON.stringify(window.kuroTextPlayEvents));}catch(e){}

    const st=document.getElementById('status');
    if(st) st.textContent=message+' OKで次打者へ';
    result.innerHTML += '<br><b>記録成功：</b>'+message;

    // 文章記録はグラフィカル入力の未処理pendingを持ち越さない
    try{
      if(typeof clearPendingPreview==='function') clearPendingPreview();
      document.querySelectorAll('.runner.pending').forEach(el=>el.classList.remove('pending'));
      if(typeof pendingPlay!=='undefined') pendingPlay=false;
      if(typeof pendingBatter!=='undefined') pendingBatter=null;
      if(typeof pendingRunnerQueue!=='undefined') pendingRunnerQueue=[];
    }catch(e){}

    setTimeout(()=>{
      show('game');
      // 画面切替やロック更新の後、最後にOKを確実に有効化
      requestAnimationFrame(()=>{
        if(typeof setAtBatReady==='function') setAtBatReady(true);
        const ok=document.getElementById('ok');
        if(ok){
          ok.classList.add('ready');
          ok.setAttribute('aria-disabled','false');
        }
        window.__kuroTextRecording=false;
      });
    },120);
  }

  // 「一塁走者三塁」「2塁走者ホームでアウト」などを拾う
  function runnerInstruction(baseNo){
    const names = baseNo===1 ? '(?:一塁走者|1塁走者)' :
                  baseNo===2 ? '(?:二塁走者|2塁走者)' :
                               '(?:三塁走者|3塁走者)';
    const re=new RegExp(names+'([^、。]*)','i');
    const mm=s.match(re);
    if(!mm) return null;
    const clause=mm[1]||'';
    const isOut=/(アウト|OUT|刺された|刺され|憤死|タッチアウト)/i.test(clause);
    let to=null;
    if(/(ホーム|本塁|得点)/.test(clause)) to='HOME';
    else if(/(三塁|3塁)/.test(clause)) to=3;
    else if(/(二塁|2塁)/.test(clause)) to=2;
    else if(/(一塁|1塁)/.test(clause)) to=1;
    return {from:baseNo,to,result:isOut?'OUT':'SAFE',clause};
  }

  try{
    // ---------- 汎用「単打＋走者指示」 ----------
    if(isSingleHit){
      const instructions=[runnerInstruction(1),runnerInstruction(2),runnerInstruction(3)].filter(Boolean);

      // 明示された走者が実際に塁上にいない場合は勝手に記録しない
      for(const ev of instructions){
        if(!bases[ev.from-1]){
          result.innerHTML += `<br><b>記録停止：</b>現在の${ev.from}塁走者を取得できません`;
          window.__kuroTextRecording=false; return;
        }
        if(ev.to===null){
          result.innerHTML += `<br><b>確認：</b>${ev.from}塁走者の行き先を読み取れません`;
          window.__kuroTextRecording=false; return;
        }
      }

      saveUndo();
      const oldBases=bases.slice();
      const batterObj=makeBatter('H');
      const next=[null,null,null];
      let runs=0, outsAdded=0;
      const events=[];

      // 明示されていない既存走者はその塁に残す
      for(let i=0;i<3;i++) if(oldBases[i]) next[i]=oldBases[i];

      // 明示された走者を元塁から外し、指示先へ
      for(const ev of instructions){
        const runner=oldBases[ev.from-1];
        next[ev.from-1]=null;
        if(ev.result==='OUT'){
          outsAdded++;
          events.push({...ev,runner});
        }else if(ev.to==='HOME'){
          runs++;
          events.push({...ev,runner});
        }else{
          // 行き先が他走者で埋まる矛盾は記録停止
          if(next[ev.to-1] && next[ev.to-1]!==runner){
            result.innerHTML += `<br><b>記録停止：</b>${ev.to}塁に走者が重なります。文章を確認してください`;
            return;
          }
          next[ev.to-1]=runner;
          events.push({...ev,runner});
        }
      }

      // 単打なので打者は一塁へ。既存走者が一塁に残る文章は曖昧として止める。
      if(next[0]){
        result.innerHTML += '<br><b>確認：</b>一塁走者の進塁先を指定してください';
        window.__kuroTextRecording=false; return;
      }
      next[0]=batterObj;
      events.push({runner:'B',to:1,result:'SAFE'});

      bases=next;
      if(runs) addRunsDirect(runs);
      if(outsAdded) addOutDirect(outsAdded);

      const msgParts=['H'];
      for(const ev of events){
        if(ev.runner==='B') continue;
        const who=ev.from+'塁走者';
        if(ev.result==='OUT') msgParts.push(who+'→'+(ev.to==='HOME'?'HOME':ev.to+'塁')+' OUT');
        else if(ev.to==='HOME') msgParts.push(who+'得点');
        else msgParts.push(who+'→'+ev.to+'塁');
      }
      msgParts.push('打者→一塁');
      if(runs) msgParts.push('SCORE +'+runs);
      if(outsAdded) msgParts.push('OUT +'+outsAdded);

      finishRecord(msgParts.join(' / ')+'。',{
        type:'H',batterObj,scoreAdded:runs,outsAdded,runnerEvents:events
      });
      return;
    }

    // ---------- 既存FC ----------
    if(forceAtSecond && batterSafe){
      if(!Array.isArray(bases) || !bases[0]){
        result.innerHTML += '<br><b>記録停止：</b>現在の一塁走者を取得できません'; window.__kuroTextRecording=false; return;
      }
      saveUndo();
      const batterObj=makeBatter('FC');
      bases[0]=batterObj;
      addOutDirect(1);
      finishRecord('FC：二塁フォースOUT / 打者→一塁 / OUT +1。',{
        type:'FC',batterObj,outsAdded:1,
        runnerEvents:[{from:1,to:2,result:'OUT',reason:'force'},{runner:'B',to:1,result:'SAFE'}]
      });
      return;
    }

    result.innerHTML += '<br><b>まだ自動記録対象外：</b>今回は読み取り結果だけ確認してください。';
    window.__kuroTextRecording=false;
  }catch(err){
    result.innerHTML += '<br><b>記録エラー：</b>'+String(err?.message||err);
    window.__kuroTextRecording=false;
  }
}
</script>
