<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>クロ野球 商品版 土台 v2.8.12</title>
<style>
*{box-sizing:border-box} :root{--navy:#17324a;--blue:#1769aa;--green:#16824b;--red:#c8443c;--bg:#f2f4f6;--line:#d5dce1;--text:#17212b}
html,body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--text)}
.app{width:min(100%,760px);margin:auto;background:#fff;min-height:100vh}
.screen{display:none;padding:14px}.screen.on{display:block}
.hero{text-align:center;padding:44px 8px 26px}.hero .ball{font-size:58px}.hero h1{margin:4px 0;font-size:34px;color:var(--navy)}.muted{color:#6e7880;font-size:13px}
button,input,select{font:inherit}.btn{min-height:48px;border:0;border-radius:11px;font-weight:800;font-size:16px}.wide{width:100%}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.light{background:#e9edf0;color:#25323c}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.head h2{margin:0;color:var(--navy);font-size:22px}
label{display:block;font-size:12px;font-weight:800;margin:9px 0 4px}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav{margin-top:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.tab{min-height:42px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:800}.tab.on{background:var(--navy);color:#fff}
.ph,.pr{display:grid;grid-template-columns:27px minmax(0,1fr) 52px 70px;gap:5px;align-items:center}.ph{font-size:10px;color:#69747c}.pr{margin:5px 0}.pr input,.pr select{min-height:38px;font-size:13px;padding:5px}.ord{text-align:center;font-weight:900}.add{width:100%;min-height:40px;border:1px dashed #9aa4ac;background:#f7f8f9;border-radius:9px;font-weight:800;margin-top:5px}
.gameTop{display:grid;grid-template-columns:1.1fr .9fr .9fr;gap:5px;text-align:center;margin-bottom:5px}.chip{background:#f1f4f6;border-radius:8px;padding:5px 3px;font-size:10px}.chip b{display:block;font-size:14px;color:var(--navy)}
.playersInfo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:5px}.pi{border:1px solid var(--line);border-radius:8px;padding:5px 7px;font-size:10px}.pi b{font-size:13px}
.field{position:relative;width:100%;aspect-ratio:1.22/1;max-height:52vh;overflow:hidden;border-radius:14px;background:#72b86d;touch-action:none;border:1px solid #b8c8b6}
.fieldBack{position:absolute;left:8px;top:8px;z-index:45;border:1px solid #ffffffcc;background:#ffffffdd;color:#263746;border-radius:10px;padding:5px 10px;font-weight:900;font-size:13px;line-height:1.2;min-height:30px;box-shadow:0 1px 4px #0003}.fieldBack:active{transform:scale(.97)}
.field svg{width:100%;height:100%;display:block;position:relative;z-index:1}.runner{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--blue);border:3px solid white;box-shadow:0 1px 3px #0004;transform:translate(-50%,-50%);display:none;touch-action:none;cursor:grab;z-index:30;color:#fff;pointer-events:auto;font-weight:900;font-size:15px;line-height:1;align-items:center;justify-content:center;text-align:center}.runner.dragging{cursor:grabbing;opacity:.95}
.runner.dragging:after{
 content:"";position:absolute;left:50%;top:50%;width:54px;height:13px;
 transform-origin:0 50%;
 transform:rotate(var(--tail-angle,180deg)) translateX(-2px);
 background:linear-gradient(90deg,rgba(255,255,255,.88),rgba(255,255,255,.38),rgba(255,255,255,0));
 clip-path:polygon(0 18%,100% 50%,0 82%);
 filter:drop-shadow(0 0 3px rgba(255,255,255,.75));
 pointer-events:none;z-index:-1;
}
.controls{display:flex;justify-content:center;gap:4px;margin-top:5px;flex-wrap:nowrap}
.play{width:48px;min-height:34px;padding:2px 4px;border:1px solid #2470b7;border-radius:7px;background:#2f80c9;color:#fff;font-weight:900;font-size:13px;box-shadow:0 1px 2px #0002}
.play.locked{background:#c4c9cd;color:#f7f7f7;border-color:#b5bbc0;box-shadow:none;opacity:1;filter:none;pointer-events:none}
.play.active{background:var(--navy);color:#fff}
.bottomBar{display:grid;grid-template-columns:68px 1fr 56px;gap:5px;margin-top:5px}.icon{min-height:42px;border:0;border-radius:9px;background:#e9edf0;font-size:19px}.ok{background:#aeb6bc;color:#fff;font-weight:900;border:0;border-radius:9px;transition:.15s}.ok.ready{background:#d43d35;box-shadow:0 0 0 2px #d43d3522}.undo{border:0;border-radius:9px;background:#e9edf0;font-weight:800}
.choice{display:none;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:5px}.choice.on{display:grid}.choice button{min-height:40px;border:0;border-radius:8px;background:#e9edf0;font-weight:800}
.runnerChoice{position:absolute;z-index:40;display:none;gap:3px;transform:translate(-50%,-100%);padding-bottom:7px;white-space:nowrap}
.runnerChoice.on{display:flex}
.runnerChoice button{min-height:26px;padding:2px 7px;border:0;border-radius:7px;background:#fff;box-shadow:0 1px 5px #0004;font-size:10px;font-weight:900}
.runnerChoice:after{content:"";position:absolute;left:50%;bottom:1px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #fff}
.status{text-align:center;font-size:11px;color:#59656e;min-height:18px;padding-top:3px}
.textPage textarea{width:100%;height:150px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px}
@media(min-width:650px){.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(240px,.65fr);gap:10px}.rightPanel{align-self:start}.field{max-height:none}.play{width:52px;min-height:36px}}
</style>

<script>
const $=q=>document.querySelector(q),$$=q=>document.querySelectorAll(q);function show(id){$$('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}
let d=new Date();$('#date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pos=['投','捕','一','二','三','遊','左','中','右','DH','控'];
const ROSTER_KEY='kuroYakyuRosterV1';
let side='my';

function blankRoster(){
  const d={my:[],opp:[]};
  for(const s of ['my','opp']){
    for(let i=0;i<9;i++) d[s].push({name:'',no:'',pos:pos[i]});
  }
  return d;
}
function loadRoster(){
  try{
    const saved=JSON.parse(localStorage.getItem(ROSTER_KEY)||'null');
    if(saved && Array.isArray(saved.my) && Array.isArray(saved.opp)) return saved;
  }catch(e){}
  return blankRoster();
}
let data=loadRoster();

function persistRoster(){
  try{ localStorage.setItem(ROSTER_KEY,JSON.stringify(data)); }catch(e){}
}
function esc(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function save(){
  [...$('#plist').children].forEach((r,i)=>{
    data[side][i]={
      name:r.querySelector('.nm').value.trim(),
      no:r.querySelector('.no').value.trim(),
      pos:r.querySelector('.po').value
    };
  });
  persistRoster();
}
function render(){
  let l=$('#plist');l.innerHTML='';
  data[side].forEach((p,i)=>{
    let r=document.createElement('div');r.className='pr';
    r.innerHTML='<span class="ord">'+(i+1)+'</span>'+
      '<input class="nm" value="'+esc(p.name)+'" placeholder="選手名">'+
      '<input class="no" inputmode="numeric" value="'+esc(p.no)+'" placeholder="No.">'+
      '<select class="po">'+pos.map(v=>'<option '+(v===p.pos?'selected':'')+'>'+v+'</option>').join('')+'</select>';
    l.appendChild(r);
  });
  l.querySelectorAll('input,select').forEach(el=>{
    el.addEventListener('change',save);
    el.addEventListener('blur',save);
  });
}
$('#start').onclick=()=>show('setup');$('#backTitle').onclick=()=>show('title');$('#toPlayers').onclick=()=>{render();show('players')};$('#backSetup').onclick=()=>{save();show('setup')};
$('#backPlayers').onclick=()=>{save();show('players')};
$$('.tab').forEach(t=>t.onclick=()=>{save();side=t.dataset.side;$$('.tab').forEach(z=>z.classList.toggle('on',z===t));render()});
$('#add').onclick=()=>{save();data[side].push({name:'',no:'',pos:'控'});persistRoster();render()};
let batterIndex=0;
let bases=[null,null,null]; // 0=一塁,1=二塁,2=三塁
let currentBatter=null;
let playOpen=false;
let atBatResultReady=false;
let playHistory=[];
function cloneObj(v){return v==null?v:JSON.parse(JSON.stringify(v))}
function capturePlayState(){
  const ln=drawnLines.length?drawnLines[drawnLines.length-1]:null;
  return {
    batterIndex,
    bases:cloneObj(bases),
    currentBatter:cloneObj(currentBatter),
    playOpen,
    atBatResultReady,
    outs:$('#outs').textContent,
    score:$('#score').textContent,
    line:ln?{x1:ln.getAttribute('x1'),y1:ln.getAttribute('y1'),x2:ln.getAttribute('x2'),y2:ln.getAttribute('y2')}:null,
    lineLocked,
    lastBattedBall:cloneObj(lastBattedBall)
  };
}
function pushPlayState(){const st=capturePlayState();st.line=null;st.lineLocked=false;st.lastBattedBall=null;playHistory.push(st);if(playHistory.length>50)playHistory.shift()}
function restorePlayState(st){
  cancelRunnerChoiceTimer();hideRunnerChoice();choice.classList.remove('on');
  batterIndex=st.batterIndex;bases=cloneObj(st.bases);currentBatter=cloneObj(st.currentBatter);playOpen=st.playOpen;
  $('#outs').textContent=st.outs;$('#score').textContent=st.score;
  drawLayer.innerHTML='';drawnLines=[];currentLine=null;drawing=false;
  if(st.line){
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    for(const k of ['x1','y1','x2','y2'])ln.setAttribute(k,st.line[k]);
    ln.setAttribute('stroke','#17212b');ln.setAttribute('stroke-width','7');ln.setAttribute('stroke-linecap','round');
    drawLayer.appendChild(ln);drawnLines.push(ln);
  }
  lineLocked=st.lineLocked;lastBattedBall=cloneObj(st.lastBattedBall);
  setAtBatReady(st.atBatResultReady);updateBatter();syncRunners();
}

function lineup(){return data.my.length?data.my:[{name:''}]}
function batterPlayer(){return lineup()[batterIndex%lineup().length]||{name:'選手'+(batterIndex+1),no:''}}
function batterName(){return batterPlayer().name||('選手'+(batterIndex+1))}
function batterNo(){return String(batterPlayer().no||'').trim()}
function updateBatter(){
  const list=lineup();
  const idx=batterIndex%list.length;
  const p=list[idx];
  $('#batter').textContent=(idx+1)+'. '+(p?.name||'選手')+'  ('+(idx+1)+'/'+list.length+')';
}
function setAtBatReady(v){
  atBatResultReady=!!v;
  $('#ok').classList.toggle('ready',atBatResultReady);
  $('#ok').textContent='OK';
  $$('.play').forEach(b=>{
    b.classList.toggle('locked',atBatResultReady);
    b.setAttribute('aria-disabled',atBatResultReady?'true':'false');
  });
}
function syncRunners(){
  [$('#r1'),$('#r2'),$('#r3')].forEach((r,i)=>{
    r.style.display=bases[i]?'flex':'none';
    r.textContent=bases[i]?(bases[i].no||bases[i].order||String(i+1)):'';
    r.style.left=basePos[i].left+'%';
    r.style.top=basePos[i].top+'%';
  });
}
$('#toGame').onclick=()=>{save();batterIndex=0;bases=[null,null,null];currentBatter=null;playOpen=false;playHistory=[];$('#outs').textContent='0';$('#score').textContent='0 - 0';drawLayer.innerHTML='';drawnLines=[];lineLocked=false;lastBattedBall=null;setAtBatReady(false);updateBatter();syncRunners();show('game')};

const choice=$('#choice'),status=$('#status'),svg=$('#fieldSvg'),drawLayer=$('#drawLayer'),runnerChoice=$('#runnerChoice');
let drawing=false,currentLine=null,drawnLines=[],runnerDrag=null,lineLocked=false;
let lastBattedBall=null;
const runners=[$('#r1'),$('#r2'),$('#r3')];
const basePos=[
 {left:69.807,top:61.887,label:'一塁'},
 {left:49.400,top:46.415,label:'二塁'},
 {left:27.778,top:61.887,label:'三塁'},
 {left:48.792,top:78.113,label:'本塁'}
];



function hideRunnerChoice(){runnerChoice.classList.remove('on');runnerChoice.innerHTML=''}
function svgPoint(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse())}
function fieldPercent(ev){const r=$('#field').getBoundingClientRect();return{x:(ev.clientX-r.left)/r.width*100,y:(ev.clientY-r.top)/r.height*100}}
function addOut(reason){
 let n=Math.min(3,Number($('#outs').textContent||0)+1);$('#outs').textContent=n;status.textContent=reason+'：OUT '+n;
}
function addRun(){
 const s=$('#score').textContent.split('-').map(v=>Number(v.trim())||0);s[0]++;$('#score').textContent=s[0]+' - '+s[1];
}
function placeBatterOnFirst(kind){
 currentBatter={name:batterName(),no:batterNo(),order:String((batterIndex%lineup().length)+1),kind,isCurrentBatter:true};

 if(!bases[0]){
   bases[0]=currentBatter;
   playOpen=true;
   syncRunners();
   return;
 }

 // Hは最低限のフォース進塁だけ自動処理。
 if(kind==='H'){
   if(bases[0] && bases[1] && bases[2]){
     addRun();
     bases[2]=bases[1]; bases[2].isCurrentBatter=false;
     bases[1]=bases[0]; bases[1].isCurrentBatter=false;
     bases[0]=currentBatter;
     playOpen=true;
     syncRunners();
     status.textContent='H：三塁走者生還、走者を1つずつ進塁';
     return;
   }
   if(bases[0] && !bases[1]){
     const lead=bases[0];
     lead.isCurrentBatter=false;
     bases[1]=lead;
     bases[0]=currentBatter;
     playOpen=true;
     syncRunners();
     status.textContent='H：一塁走者→二塁、打者→一塁';
     return;
   }
 }
 status.textContent='走者が詰まっています。先の走者から動かしてください';
 currentBatter=null;
}
function placeExtraBaseHit(kind){
  const target = kind==='2B' ? 1 : 2;

  const batter={
    name:batterName(),
    no:batterNo(),
    order:String((batterIndex%lineup().length)+1),
    kind,
    isCurrentBatter:true
  };

  // v2.8.10 二塁打：打者を二塁へ置くために必要な「最低限の連鎖進塁」を自動処理。
  // 走者が詰まっている場合は、前の走者から順に必要な分だけ進める。
  if(kind==='2B'){
    const r1=bases[0], r2=bases[1], r3=bases[2];
    let runs=0;
    let new3=null;

    // 打者が二塁へ到達するため、一塁走者か二塁走者がいれば誰かが三塁へ進む。
    // 一塁走者がいる場合は一塁走者を三塁へ（ユーザー確認済みの基本仕様）。
    // 一塁走者がいない場合は二塁走者を三塁へ。
    const toThird = r1 || r2 || null;

    // 三塁に新しい走者が入るなら、元の三塁走者は生還。
    if(toThird && r3){
      addRun(); runs++;
    }

    // 一・二塁が同時にいた場合、一塁走者が三塁へ入るので元二塁走者は生還。
    if(r1 && r2){
      addRun(); runs++;
    }

    if(toThird){
      toThird.isCurrentBatter=false;
      new3=toThird;
    }else{
      // 三塁走者だけなら、二塁打でも勝手に生還させない。
      new3=r3;
    }

    bases=[null,batter,new3];
    currentBatter=batter;
    playOpen=true;
    syncRunners();
    setAtBatReady(true);
    status.textContent=extraBaseLabel(kind)+'：'+(runs?runs+'得点・':'')+'打者二塁';
    return;
  }

  // 三塁打は現行仕様を維持（今回の修正対象外）。
  let runs=0;
  for(let i=0;i<3;i++){
    if(bases[i]){ addRun(); runs++; }
  }
  bases=[null,null,null];
  bases[target]=batter;
  currentBatter=batter;
  playOpen=true;
  syncRunners();
  setAtBatReady(true);
  status.textContent=extraBaseLabel(kind)+'：'+runs+'得点、打者三塁';
}

function forceWalk(kind){
 const batter={name:batterName(),no:batterNo(),order:String((batterIndex%lineup().length)+1),kind,isCurrentBatter:true};
 // only forced runners advance, from third backwards
 if(bases[0]){
   if(bases[1]){
     if(bases[2]){addRun();bases[2]=null}
     bases[2]=bases[1];bases[1]=null;
   }
   bases[1]=bases[0];bases[0]=null;
 }
 bases[0]=batter;
 currentBatter=batter;playOpen=true;syncRunners();
 status.textContent=(kind==='B'?'四球':'死球')+'：必要な走者だけフォース進塁';
}

svg.addEventListener('pointerdown',ev=>{
 if(lineLocked){ status.textContent='このプレーは打球線を記録済み。OKか戻すを選択'; return; }
 ev.preventDefault();drawing=true;playOpen=true;svg.setPointerCapture(ev.pointerId);
 const p={x:390.338,y:390.000};currentLine=document.createElementNS('http://www.w3.org/2000/svg','line');
 currentLine.setAttribute('x1','390.338');currentLine.setAttribute('y1','507.736');currentLine.setAttribute('x2',p.x);currentLine.setAttribute('y2',p.y);
 currentLine.setAttribute('stroke','#17212b');currentLine.setAttribute('stroke-width','7');currentLine.setAttribute('stroke-linecap','round');drawLayer.appendChild(currentLine);
});
svg.addEventListener('pointermove',ev=>{if(!drawing||!currentLine)return;ev.preventDefault();const p=svgPoint(ev);currentLine.setAttribute('x2',p.x);currentLine.setAttribute('y2',p.y)});
function finishLine(){if(!drawing)return;drawing=false;if(currentLine){drawnLines.push(currentLine);currentLine=null;lineLocked=true;rememberBattedBallFromLine();status.textContent='打球線を記録。結果を選択'}}
svg.addEventListener('pointerup',finishLine);svg.addEventListener('pointercancel',finishLine);


function classifyBattedBall(x,y){
  // SVG座標では左=レフト、中央=センター、右=ライト
  const dx=x-400;
  if(dx<-190) return {zone:'LF',label:'レフト'};
  if(dx<-70)  return {zone:'LCF',label:'左中間'};
  if(dx<=70)  return {zone:'CF',label:'センター'};
  if(dx<=190) return {zone:'RCF',label:'右中間'};
  return {zone:'RF',label:'ライト'};
}
function rememberBattedBallFromLine(){
  if(!drawnLines.length)return null;
  const ln=drawnLines[drawnLines.length-1];
  const x2=parseFloat(ln.getAttribute('x2')||'400');
  const y2=parseFloat(ln.getAttribute('y2')||'0');
  lastBattedBall={x:x2,y:y2,...classifyBattedBall(x2,y2)};
  return lastBattedBall;
}
function hitLabel(){
  const b=lastBattedBall||rememberBattedBallFromLine();
  if(!b) return 'ヒット';
  if(b.zone==='LF'||b.zone==='CF'||b.zone==='RF') return b.label+'前ヒット';
  return b.label+'ヒット';
}
function extraBaseLabel(kind){
  const b=lastBattedBall||rememberBattedBallFromLine();
  const where=b?b.label:'';
  return where+(kind==='2B'?'二塁打':'三塁打');
}

function choices(arr){
 choice.innerHTML='';arr.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{fn();choice.classList.remove('on')};choice.appendChild(b)});choice.classList.add('on')
}
$$('.play').forEach(b=>b.onclick=()=>{
 if(atBatResultReady){
   status.textContent='打席結果は確定済みです。赤いOKで次の打者へ';
   return;
 }
 const p=b.dataset.p;
 if((p==='H'||p==='2B'||p==='3B'||p==='HR'||p==='OUT') && !lineLocked){
   status.textContent='⚠️ 先に打球の線を引いてください';
   return;
 }
 pushPlayState();
 if(p==='HR'){
   const runnerCount=bases.filter(Boolean).length;
   const runs=runnerCount+1;
   for(let i=0;i<runs;i++) addRun();
   bases=[null,null,null];
   currentBatter=null;
   playOpen=true;
   setAtBatReady(true);
   syncRunners();
   status.textContent='HR：'+runs+'得点。走者と打者を自動で生還';
 }
 if(p==='H'){placeBatterOnFirst('H');setAtBatReady(true);status.textContent=hitLabel()+'：打者一塁。走者処理後、赤いOKで次打者へ'}
 if(p==='2B'){placeExtraBaseHit('2B')}
 if(p==='3B'){placeExtraBaseHit('3B')}
 if(p==='OUT')choices([
   ['ゴロ',()=>{addOut('ゴロ');playOpen=true;setAtBatReady(true)}],
   ['フライ',()=>{addOut('フライ');playOpen=true;setAtBatReady(true)}],
   ['ライナー',()=>{addOut('ライナー');playOpen=true;setAtBatReady(true)}],
   ['その他',()=>{addOut('OUT');playOpen=true;setAtBatReady(true)}]
 ]);
 if(p==='K')choices([
   ['空振り',()=>{addOut('空振り三振');playOpen=true;setAtBatReady(true)}],
   ['見逃し',()=>{addOut('見逃し三振');playOpen=true;setAtBatReady(true)}]
 ]);
 if(p==='B'){forceWalk('B');setAtBatReady(true)}
 if(p==='HP'){forceWalk('HP');setAtBatReady(true)}
});

let runnerChoiceTimer=null;

function cancelRunnerChoiceTimer(){
  if(runnerChoiceTimer){ clearTimeout(runnerChoiceTimer); runnerChoiceTimer=null; }
}

function settleRunnerSafe(from,to,kind='進塁'){
  if(to===3){
    bases[from]=null;
    addRun();
    syncRunners();
    status.textContent='本塁到達：1得点';
    return;
  }
  if(bases[to]){
    syncRunners();
    status.textContent='その塁には走者がいます';
    return;
  }
  bases[to]=bases[from];
  bases[from]=null;
  syncRunners();
  status.textContent=kind+'：'+basePos[to].label;
}

function delayedChoices(runner,from,to){
  cancelRunnerChoiceTimer();
  hideRunnerChoice();

  // ランナーは到達塁に見た目だけ置く。約1秒後に小さな選択肢。
  runner.style.left=basePos[to].left+'%';
  runner.style.top=basePos[to].top+'%';
  status.textContent=basePos[to].label+'に到達…';

  runnerChoiceTimer=setTimeout(()=>{
    runnerChoiceTimer=null;
    runnerChoice.innerHTML='';
    runnerChoice.style.left=basePos[to].left+'%';
    runnerChoice.style.top=basePos[to].top+'%';

    const moving=bases[from];
    const add=(label,fn)=>{
      const b=document.createElement('button');
      b.textContent=label;
      b.onclick=()=>{ cancelRunnerChoiceTimer(); fn(); hideRunnerChoice(); };
      runnerChoice.appendChild(b);
    };

    // H後の打者走者を動かした時は、到達塁に応じて打撃結果を確認。
    if(from===0 && moving?.isCurrentBatter && moving?.kind==='H' && (to===1 || to===2)){
      if(to===1){
        add('2B',()=>{
          if(!bases[1]){
            bases[1]=bases[0]; bases[0]=null; bases[1].kind='2B';
            syncRunners(); status.textContent=extraBaseLabel('2B')+'として記録';
          }
        });
      }else{
        add('3B',()=>{
          if(!bases[2]){
            bases[2]=bases[0]; bases[0]=null; bases[2].kind='3B';
            syncRunners(); status.textContent=extraBaseLabel('3B')+'として記録';
          }
        });
      }
      add('H＋進塁',()=>{
        if(!bases[to]){
          bases[to]=bases[0]; bases[0]=null; bases[to].kind='H+ADV';
          syncRunners(); status.textContent='単打＋進塁として記録';
        }
      });
      add('OUT',()=>{
        cancelRunnerChoiceTimer();
        bases[from]=null;
        addOut('走塁OUT');
        syncRunners();
        hideRunnerChoice();
        status.textContent='走者OUT：アウトカウント＋1';
      });
    }else if(to===3){
      add('得点',()=>settleRunnerSafe(from,to));
      add('OUT',()=>{
        cancelRunnerChoiceTimer();
        bases[from]=null;
        addOut('走塁OUT');
        syncRunners();
        hideRunnerChoice();
        status.textContent='走者OUT：アウトカウント＋1';
      });
    }else{
      add('進塁',()=>settleRunnerSafe(from,to,'進塁'));
      add('盗塁',()=>settleRunnerSafe(from,to,'盗塁'));
      add('OUT',()=>{
        cancelRunnerChoiceTimer();
        bases[from]=null;
        addOut('走塁OUT');
        syncRunners();
        hideRunnerChoice();
        status.textContent='走者OUT：アウトカウント＋1';
      });
      add('その他',()=>{
        settleRunnerSafe(from,to,'その他');
      });
    }
    runnerChoice.classList.add('on');
    status.textContent='結果を選択';
  },1000);
}

function showDeathDelayed(from){
  cancelRunnerChoiceTimer();
  runnerChoice.innerHTML='';
  [['進塁死','進塁死'],['盗塁死','盗塁死'],['牽制死','牽制死']].forEach(([lab,reason])=>{
    const b=document.createElement('button');
    b.textContent=lab;
    b.onclick=()=>{
      bases[from]=null;
      addOut(reason);
      syncRunners();
      hideRunnerChoice();
    };
    runnerChoice.appendChild(b);
  });
  runnerChoice.classList.add('on');
  status.textContent='アウトの種類を選択';
}

function attachRunner(runner,index){
 runner.addEventListener('pointerdown',ev=>{
   if(!bases[index])return;
   ev.preventDefault();ev.stopPropagation();
   drawing=false;currentLine=null;
   cancelRunnerChoiceTimer();hideRunnerChoice();
   runner.setPointerCapture(ev.pointerId);
   runnerDrag={runner,index,startLeft:runner.style.left,startTop:runner.style.top,lastX:ev.clientX,lastY:ev.clientY};
   runner.style.setProperty('--tail-angle','180deg');
   runner.classList.add('dragging');
 });
 runner.addEventListener('pointermove',ev=>{
   if(!runnerDrag||runnerDrag.runner!==runner)return;
   ev.preventDefault();ev.stopPropagation();
   const dx=ev.clientX-runnerDrag.lastX,dy=ev.clientY-runnerDrag.lastY;
   if(Math.abs(dx)+Math.abs(dy)>1){
     const angle=Math.atan2(dy,dx)*180/Math.PI+180;
     runner.style.setProperty('--tail-angle',angle+'deg');
     runnerDrag.lastX=ev.clientX;runnerDrag.lastY=ev.clientY;
   }
   const p=fieldPercent(ev);
   runner.style.left=p.x+'%';runner.style.top=p.y+'%';
 });
 runner.addEventListener('pointerup',ev=>{
   if(!runnerDrag||runnerDrag.runner!==runner)return;
   ev.preventDefault();ev.stopPropagation();
   runner.classList.remove('dragging');

   const p=fieldPercent(ev);
   const from=index;

   // 元の塁より先なら、二塁を飛ばして三塁などにも直接置ける。
   let to=-1,best=999;
   for(let i=from+1;i<basePos.length;i++){
     const dist=Math.hypot(p.x-basePos[i].left,p.y-basePos[i].top);
     if(dist<best){best=dist;to=i;}
   }
   if(to<0 || best>18){
     syncRunners();
     status.textContent=basePos[from].label+'走者：到達する塁へドラッグ';
     runnerDrag=null;
     return;
   }

   runnerDrag=null;
   delayedChoices(runner,from,to);
 });
 runner.addEventListener('pointercancel',()=>{
   cancelRunnerChoiceTimer();
   runnerDrag=null;
   runner.classList.remove('dragging');
   syncRunners();
 });
}
runners.forEach(attachRunner);

$('#undo').onclick=()=>{
 cancelRunnerChoiceTimer();hideRunnerChoice();choice.classList.remove('on');
 const st=playHistory.pop();
 if(st){restorePlayState(st);status.textContent='一つ前のプレーに戻しました';return;}
 const last=drawnLines.pop();
 if(last){last.remove();lineLocked=false;lastBattedBall=null;status.textContent='打球線を1本戻しました'}else status.textContent='戻す対象はありません';
};
$('#ok').onclick=()=>{
 cancelRunnerChoiceTimer();
 if(!atBatResultReady){
   status.textContent='⚠️ 打席結果を入力してください';
   return;
 }
 // 二塁打の打者が二塁にいるのに一塁走者が残っている場合は、
 // 走者処理が未完了。勝手に次打者へ進ませない。
 if(currentBatter?.kind==='2B' && bases[1]===currentBatter && bases[0]){
   status.textContent='⚠️ 前の走者が未処理です。先の走者から実際の到達塁へ動かしてください';
   return;
 }
 hideRunnerChoice();choice.classList.remove('on');
 drawLayer.innerHTML='';drawnLines=[];currentLine=null;drawing=false;lineLocked=false;
 bases.forEach(p=>{if(p)p.isCurrentBatter=false});
 batterIndex++;
 currentBatter=null;
 playOpen=false;
 setAtBatReady(false);
 updateBatter();
 syncRunners();
 status.textContent='次の打者へ。走者はそのまま';
};
$('#text').onclick=()=>show('textPage');$('#backGame').onclick=()=>show('game');$('#textOk').onclick=()=>{$('#textPage textarea').value='';show('game');status.textContent='文字入力は次段階で記録エンジンに接続'};
render();
