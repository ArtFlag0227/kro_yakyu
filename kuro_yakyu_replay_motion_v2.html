<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>クロ野球・動く素材版リプレイ V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0c0c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:8px}
h1{font-size:18px;text-align:center;margin:4px 0 8px}
.stage{position:relative;width:100%;aspect-ratio:1.59/1;overflow:hidden;border:3px solid #454545;border-radius:14px;background:#76bf2f}
.field{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.sprite{position:absolute;transform:translate(-50%,-50%);object-fit:contain;mix-blend-mode:multiply;image-rendering:auto;z-index:5}
.pitcher{width:8.3%;left:50%;top:54%}
.batter{width:11%;left:43%;top:82%}
.fielder{width:7.6%}
.fP{left:50%;top:54%} .fC{left:50%;top:88%}
.f1{left:68%;top:65%} .f2{left:61%;top:52%} .f3{left:32%;top:65%}
.fSS{left:39%;top:52%} .fLF{left:23%;top:34%} .fCF{left:50%;top:27%} .fRF{left:77%;top:34%}
.runner{width:7.6%;left:68%;top:66%;display:none;z-index:8}
.ball{position:absolute;width:1.2%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 5px #000;display:none;z-index:12;transform:translate(-50%,-50%)}
.caption{position:absolute;left:50%;top:4%;transform:translateX(-50%);z-index:30;background:#000d;border:2px solid #fff;border-radius:999px;padding:7px 15px;font-weight:900;white-space:nowrap}
.score{position:absolute;left:2%;top:4%;z-index:30;background:#000d;border:2px solid #fff;padding:6px 9px;font-weight:900;border-radius:8px}
.legend{position:absolute;right:2%;top:4%;z-index:30;background:#000d;border:2px solid #fff;padding:6px 9px;font-weight:900;border-radius:8px}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
button,select,input{min-height:40px;border:0;border-radius:9px;font-weight:800;font-size:13px}
button{background:#178d67;color:#fff}
button.alt{background:#555}
.colorbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}
.coloritem{background:#1a1a1a;border:1px solid #444;border-radius:9px;padding:6px;font-size:11px}
.coloritem input{width:100%;height:34px;padding:0;background:transparent}
.note{text-align:center;color:#aaa;font-size:11px;margin:7px 0}
@media(max-width:700px){
 .pitcher{width:10%} .batter{width:13%} .fielder,.runner{width:9%}
 .caption{font-size:11px;padding:5px 9px} .score,.legend{font-size:10px}
 .controls{grid-template-columns:1fr 1fr}
}
</style>

const cache=new Map();
function loadImg(src){
  if(cache.has(src)) return cache.get(src);
  const p=new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src;});
  cache.set(src,p); return p;
}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function near(c,t,tol=20){return Math.abs(c[0]-t[0])<tol&&Math.abs(c[1]-t[1])<tol&&Math.abs(c[2]-t[2])<tol}
async function paint(canvas,src,team='op'){
  const im=await loadImg(src);
  canvas.width=im.naturalWidth; canvas.height=im.naturalHeight;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(im,0,0);
  const d=ctx.getImageData(0,0,canvas.width,canvas.height), a=d.data;
  const top=hexRgb(document.getElementById(team==='my'?'myTop':'opTop').value);
  const bottom=hexRgb(document.getElementById(team==='my'?'myBottom':'opBottom').value);
  const blue=[12,60,150];
  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const i=(y*canvas.width+x)*4, c=[a[i],a[i+1],a[i+2]];
      if(a[i]>247&&a[i+1]>247&&a[i+2]>247){a[i+3]=0;continue;}
      if(near(c,blue,26)){
        // hat + jersey stay upper color; low isolated blue pieces read as shoes/pants accent.
        const use=(y/canvas.height>0.67)?bottom:top;
        a[i]=use[0];a[i+1]=use[1];a[i+2]=use[2];
      }
    }
  }
  ctx.putImageData(d,0,0);
}
const pitcher=document.getElementById('pitcher'), batter=document.getElementById('batter'), runnerEl=document.getElementById('runner');
const ball=document.getElementById('ball'), cap=document.getElementById('caption');
let defenseOn=true, timers=[];
function later(ms,fn){timers.push(setTimeout(fn,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function pitchFrames(){return document.getElementById('pitchHand').value==='L'?PITCH_L:PITCH_R}
function batFrames(){return document.getElementById('batHand').value==='L'?BAT_L:BAT_R}
async function drawDefense(frame=0){
 const arr=[...document.querySelectorAll('.fielder')];
 for(const c of arr){c.style.display=defenseOn?'block':'none'; if(defenseOn) await paint(c,FIELD[Math.min(frame,FIELD.length-1)],'op');}
}
function ballAt(x,y,show=true){ball.style.left=x+'%';ball.style.top=y+'%';ball.style.display=show?'block':'none'}
async function resetScene(){
 clearTimers(); cap.textContent='準備OK'; ball.style.display='none';runnerEl.style.display='none';
 pitcher.style.left='50%';pitcher.style.top='54%';batter.style.left='43%';batter.style.top='82%';
 await paint(pitcher,pitchFrames()[0],'op'); await paint(batter,batFrames()[0],'my'); await drawDefense(0);
 document.getElementById('legend').textContent=(document.getElementById('pitchHand').value==='L'?'左投手':'右投手')+' / '+(document.getElementById('batHand').value==='L'?'左打者':'右打者');
}
async function playPitchBat(){
 clearTimers(); await resetScene(); cap.textContent='投球！';
 const pf=pitchFrames(),bf=batFrames();
 later(220,()=>paint(pitcher,pf[1],'op'));
 later(430,()=>paint(pitcher,pf[2],'op'));
 later(610,()=>{paint(pitcher,pf[3],'op');ballAt(50,58,true)});
 later(680,()=>{ball.style.transition='all .42s linear';ballAt(44,78,true)});
 later(930,()=>paint(batter,bf[1],'my'));
 later(1040,()=>{paint(batter,bf[2],'my');cap.textContent='打った！'});
 later(1180,()=>paint(batter,bf[3],'my'));
 later(1450,()=>{ball.style.transition='none';ball.style.display='none'});
}
async function playFull(){
 await playPitchBat();
 later(1180,()=>{ball.style.transition='all .75s ease-out';ballAt(39,48,true);cap.textContent='ショートへ！'});
 later(1450,()=>{document.querySelector('.fSS').style.left='42%';document.querySelector('.fSS').style.top='49%';drawDefense(1)});
 later(1700,()=>{runnerEl.style.display='block';runnerEl.style.left='47%';runnerEl.style.top='80%';paint(runnerEl,RUN[0],'my');cap.textContent='走った！'});
 later(1880,()=>paint(runnerEl,RUN[1],'my'));
 later(2050,()=>{runnerEl.style.transition='all .75s linear';runnerEl.style.left='68%';runnerEl.style.top='66%';paint(runnerEl,RUN[2],'my');});
 later(2300,()=>{drawDefense(2);ball.style.transition='all .55s linear';ballAt(68,65,true);cap.textContent='一塁へ送球！'});
 later(2850,()=>{cap.textContent='アウト！';ball.style.display='none';paint(runnerEl,RUN[3],'my')});
}
async function demoDoublePlay(){
 await resetScene(); runnerEl.style.display='block';runnerEl.style.left='68%';runnerEl.style.top='66%';await paint(runnerEl,RUN[0],'my');
 cap.textContent='一塁走者あり';
 later(500,()=>playFull());
 later(2400,()=>{cap.textContent='二塁へ！';ballAt(50,58,true);ball.style.transition='all .45s linear';ballAt(50,47,true)});
 later(2900,()=>{cap.textContent='一塁転送！';ball.style.transition='all .55s linear';ballAt(68,65,true)});
 later(3500,()=>{cap.textContent='DOUBLE PLAY!!';ball.style.display='none'});
}
async function demoSacFly(){
 await resetScene(); runnerEl.style.display='block';runnerEl.style.left='32%';runnerEl.style.top='66%';await paint(runnerEl,RUN[0],'my');
 cap.textContent='三塁走者あり';
 later(600,()=>playPitchBat());
 later(1800,()=>{cap.textContent='外野フライ！';ballAt(43,78,true);ball.style.transition='all 1s ease-out';ballAt(50,29,true)});
 later(2850,()=>{cap.textContent='タッチアップ！';runnerEl.style.transition='all 1s linear';runnerEl.style.left='50%';runnerEl.style.top='87%';paint(runnerEl,RUN[1],'my')});
 later(4000,()=>{cap.textContent='ホームイン！';runnerEl.style.display='none';ball.style.display='none'});
}
function toggleDefense(){defenseOn=!defenseOn;drawDefense(0)}
['myTop','myBottom','opTop','opBottom','pitchHand','batHand'].forEach(id=>document.getElementById(id).addEventListener('change',resetScene));
resetScene();
</script>
