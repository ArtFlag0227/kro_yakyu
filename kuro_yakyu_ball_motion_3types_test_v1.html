    <div class="ball" id="ball"></div>
    <div class="badge" id="badge">⚾ 打球テスト</div>
  </div>
  <div class="controls">
    <button onclick="playGrounder()">ゴロ</button>
    <button onclick="playLiner()">ライナー</button>
    <button onclick="playFly()">フライ</button>
  </div>
  <div class="note">ゴロ＝ゆっくり直線 ／ ライナー＝速い直線 ／ フライ＝弧＋大→小</div>
</div>
<script>
const ball=document.getElementById('ball');
const badge=document.getElementById('badge');
const START={x:46,y:72};
const TARGET={x:69,y:43};

function resetBall(){
  ball.getAnimations().forEach(a=>a.cancel());
  ball.style.left=START.x+'%';
  ball.style.top=START.y+'%';
  ball.style.transform='translate(-50%,-50%) scale(1)';
}
function kf(x,y,scale=1){
  return {left:x+'%',top:y+'%',transform:`translate(-50%,-50%) scale(${scale})`};
}
function playGrounder(){
  resetBall(); badge.textContent='⚾ ゴロ';
  ball.animate([
    kf(START.x,START.y,1),
    kf(START.x+5.5,START.y-6.8,1),
    kf(START.x+11.5,START.y-14.2,1),
    kf(START.x+17,START.y-21.5,1),
    kf(TARGET.x,TARGET.y,1)
  ],{duration:2100,easing:'linear',fill:'forwards'});
}
function playLiner(){
  resetBall(); badge.textContent='⚾ ライナー';
  ball.animate([kf(START.x,START.y,1),kf(TARGET.x,TARGET.y,1)],
    {duration:620,easing:'linear',fill:'forwards'});
}
function playFly(){
  resetBall(); badge.textContent='⚾ フライ';
  const midX=(START.x+TARGET.x)/2;
  ball.animate([
    kf(START.x,START.y,1),
    kf(START.x+5,START.y-18,1.45),
    kf(midX,START.y-30,2.15),
    kf(TARGET.x-5,TARGET.y-12,1.55),
    kf(TARGET.x,TARGET.y,1)
  ],{duration:1900,easing:'cubic-bezier(.28,.62,.35,1)',fill:'forwards'});
}
resetBall();
</script>
