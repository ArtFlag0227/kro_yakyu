<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>クロ野球 v3.3.125 グラウンド最優先版</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d100e}
#app{display:block;width:100%;height:100dvh;border:0;background:#0d100e}
</style>
</head>
<body>
<iframe id="app" src="kuro_yakyu_v3_3_124_gameplay_ui_and_scoring_fix.html" allow="fullscreen"></iframe>
<script>
(()=>{
  const frame=document.getElementById('app');

  const FIELD_FIRST_CSS = `
  /* v3.3.125: グラウンドを主役にする。周辺UIを極限まで圧縮 */
  @media(max-width:649px){
    #game.screen.on{
      padding:env(safe-area-inset-top) 4px max(2px,env(safe-area-inset-bottom))!important;
    }

    #game .game{gap:0!important}
    #game .game>div:first-child{min-height:0!important}

    /* 上部情報を薄く */
    #game .gameTop{gap:3px!important;margin-bottom:1px!important}
    #game .gameTop .chip{
      padding:2px 1px!important;
      font-size:8px!important;
      line-height:1.05!important
    }
    #game .gameTop .chip b{
      font-size:11px!important;
      line-height:1.05!important
    }
    #game .attackTeamName{
      min-height:18px!important;
      padding:1px 5px!important;
      font-size:9px!important;
      line-height:1.1!important
    }
    #game #gameFinishBtn{
      min-height:20px!important;
      padding:1px 5px!important;
      font-size:9px!important
    }

    #game .playersInfo{gap:3px!important;margin-bottom:1px!important}
    #game .pi{
      padding:2px 4px!important;
      font-size:8px!important;
      line-height:1.05!important
    }
    #game .pi b{
      font-size:10px!important;
      line-height:1.05!important
    }

    #game .batterStatsCard{
      margin:1px 0 2px!important;
      padding:2px 5px!important
    }
    #game .batterStatsMain{
      gap:4px!important;
      font-size:8px!important;
      line-height:1.05!important
    }
    #game .batterStatsMain .bigStat{font-size:10px!important}
    #game .batterStatsToday{display:none!important}

    /* 余った高さは全部グラウンドへ */
    #game #field{
      flex:1 1 auto!important;
      min-height:0!important;
      height:auto!important;
      max-height:none!important;
      aspect-ratio:auto!important;
      margin-top:0!important;
      border-radius:8px!important
    }

    /* 球場内の補助ボタンも小型化 */
    #game #gameScoreboardBtn{
      left:4px!important;
      bottom:4px!important;
      min-height:25px!important;
      padding:2px 5px!important;
      font-size:9px!important
    }
    #game #editMembers{
      right:4px!important;
      bottom:4px!important;
      min-height:25px!important;
      padding:2px 5px!important;
      font-size:9px!important
    }
    #game #gameRecordCenter{
      right:4px!important;
      top:4px!important;
      min-height:25px!important;
      padding:2px 5px!important;
      font-size:9px!important
    }

    /* 野手は見た目は小さく、タップ判定は大きく */
    #game .fielderLayer{z-index:82!important}
    #game .fielderDot{
      width:46px!important;
      height:46px!important;
      z-index:83!important
    }
    #game .fielderDot::before{inset:8px!important}

    /* 捕手は可能な限り下へ */
    #game .fielderDot[data-pos="捕"]{
      top:calc(100% - 18px)!important;
      width:42px!important;
      height:42px!important;
      z-index:84!important
    }
    #game .fielderDot[data-pos="捕"]::before{inset:7px!important}

    /* 満塁でもショート・二塁手など野手を押せるように野手を前面へ */
    #game .runner,#game .pendingBatter{z-index:70!important}
    #game .runnerChoice{z-index:120!important}

    /* 下部操作欄を徹底的に圧縮 */
    #game .rightPanel{
      flex:0 0 auto!important;
      margin-top:2px!important;
      padding:3px 4px 2px!important;
      border-radius:8px!important
    }
    #game .playPanelHeading{
      min-height:18px!important;
      gap:3px!important
    }
    #game .playPanelHeading .morePlayActions,
    #game #playStageBack{
      min-height:19px!important;
      padding:1px 5px!important;
      font-size:9px!important;
      line-height:1!important
    }

    #game .playStageArea{
      min-height:55px!important;
      max-height:55px!important
    }
    #game .playStageArea .controls,
    #game .controls{
      gap:2px!important;
      margin:2px 0 0!important
    }
    #game .playStageArea .play,
    #game .controls .play{
      min-height:25px!important;
      padding:0 1px!important;
      border-radius:5px!important;
      font-size:10px!important;
      line-height:1!important
    }

    #game #choice.on:not(.warningModal){
      max-height:55px!important;
      gap:2px!important;
      margin-top:2px!important;
      padding:2px!important
    }
    #game #choice.on:not(.warningModal) button{
      min-height:24px!important;
      padding:1px!important;
      font-size:10px!important;
      line-height:1!important
    }

    #game .buntActionRow{
      gap:2px!important;
      margin-top:2px!important
    }
    #game .buntActionRow button{
      min-height:24px!important;
      padding:1px 2px!important;
      font-size:9px!important
    }

    #game .playSelectionSummary{
      min-height:20px!important;
      margin-top:2px!important;
      padding:2px 5px!important;
      font-size:9px!important;
      line-height:1.15!important
    }

    #game .bottomBar{
      grid-template-columns:54px 1fr 40px!important;
      gap:3px!important;
      margin-top:2px!important
    }
    #game .bottomBar button,
    #game #ok{
      min-height:29px!important;
      border-radius:6px!important
    }
    #game #undo{
      font-size:9px!important;
      padding:1px 2px!important
    }
    #game #ok{font-size:16px!important}
    #game #text{
      font-size:13px!important;
      padding:1px!important
    }

    #game .status{
      min-height:12px!important;
      max-height:14px!important;
      margin-top:1px!important;
      padding:1px 2px!important;
      font-size:8px!important;
      line-height:1.1!important
    }

    #game #foulFlyOutBtn{
      min-height:27px!important;
      margin-top:2px!important;
      font-size:10px!important
    }
  }`;

  function applyFieldFirst(){
    try{
      const doc=frame.contentDocument;
      if(!doc) return;
      const old=doc.getElementById('kuro-v33125-max-touch-field');
      if(old) old.remove();
      const style=doc.createElement('style');
      style.id='kuro-v33125-max-touch-field';
      style.textContent=FIELD_FIRST_CSS;
      doc.head.appendChild(style);
      doc.title='クロ野球 v3.3.125 グラウンド最優先版';
    }catch(e){
      console.error('v125 style injection failed',e);
    }
  }

  frame.addEventListener('load',()=>{
    applyFieldFirst();
    setTimeout(applyFieldFirst,80);
    setTimeout(applyFieldFirst,300);
  });
})();
</script>
</body>
</html>
