<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="クロ野球">
<title>クロ野球</title>
<style>
body{margin:0;background:#101010;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{padding:18px;text-align:center;background:#202020;font-weight:800;font-size:22px}
main{max-width:600px;margin:auto;padding:18px}.screen{display:none}.screen.active{display:block}
.card{background:#1d1d1d;border:1px solid #333;border-radius:16px;padding:20px}
h2{text-align:center}.field{margin:14px 0}.field label{display:block;color:#bbb;margin-bottom:6px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #555;background:#292929;color:#fff;font-size:17px}
button{width:100%;padding:17px;margin-top:16px;border:0;border-radius:10px;background:#087f5b;color:#fff;font-size:18px;font-weight:700}
.player{background:#292929;padding:13px;border-radius:9px;margin:8px 0}
.big{text-align:center;font-size:28px;font-weight:800;margin:18px 0}.note{text-align:center;color:#999;font-size:13px}
</style>
</head>
<body>
<header>⚾ クロ野球</header>
<main>
<section id="s1" class="screen active"><div class="card">
<h2>① 試合設定</h2>
<div class="field"><label>自チーム</label><input id="myteam" value="クロチーム"></div>
<div class="field"><label>相手チーム</label><input id="opp" value="相手チーム"></div>
<div class="field"><label>球場</label><input id="field" value="〇〇グラウンド"></div>
<button onclick="go2()">スタメンへ →</button>
<p class="note">まずは画面移動を確認します</p>
</div></section>

<section id="s2" class="screen"><div class="card">
<h2>② スタメン</h2>
<div class="player">1番　1　山田</div><div class="player">2番　2　佐藤</div><div class="player">3番　3　鈴木</div>
<button onclick="go3()">試合開始 →</button>
<p class="note">ここまで来たら成功！</p>
</div></section>

<section id="s3" class="screen"><div class="card">
<h2>③ 試合</h2><div class="big">1回表</div><div class="big" id="score">クロチーム　0 − 0　相手チーム</div>
<div class="player">1番　1　山田</div>
<p class="note">🎉 画面移動テスト成功！</p>
</div></section>
</main>
<script>
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)}
function go2(){show("s2")}
function go3(){document.getElementById("score").textContent=(document.getElementById("myteam").value||"クロチーム")+"　0 − 0　"+(document.getElementById("opp").value||"相手チーム");show("s3")}
</script>
</body>
</html>
