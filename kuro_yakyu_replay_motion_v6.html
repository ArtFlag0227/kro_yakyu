const batter=document.getElementById('batter');
const ball=document.getElementById('ball');
const caption=document.getElementById('caption');
const progress=document.getElementById('progress');
let timers=[], started=0, duration=3600, running=false;

function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function frame(name,text){
  batter.src=SPRITES[name];
  if(text) caption.textContent=text;
}
function later(ms,fn){timers.push(setTimeout(fn,ms))}
function reset(){
  clearTimers(); running=false;
  batter.style.transition='none';
  batter.style.left='42.5%'; batter.style.top='79%'; batter.style.transform='translate(-50%,-50%)';
  ball.style.transition='none'; ball.style.opacity='0'; ball.style.left='50%'; ball.style.top='55%';
  progress.style.transition='none'; progress.style.width='0';
  frame('stance','構え');
}
function play(){
  reset(); running=true; started=Date.now();
  progress.style.transition='width 3.6s linear'; requestAnimationFrame(()=>progress.style.width='100%');

  later(0,()=>frame('stance','① 構え'));
  later(430,()=>frame('takeback','② テイクバック'));
  later(820,()=>frame('swing','③ 振り始め'));

  later(1120,()=>{
    frame('contact','④ インパクト！');
    ball.style.opacity='1';
    ball.style.left='46%'; ball.style.top='70%';
    ball.style.transition='left .7s ease-out, top .7s ease-out';
    requestAnimationFrame(()=>{ball.style.left='62%';ball.style.top='38%'});
  });

  later(1420,()=>frame('follow','⑤ フォロースルー'));
  later(1780,()=>{frame('battoss','⑥ バットを放す');ball.style.opacity='0'});

  later(2150,()=>{
    frame('run1','⑦ 一塁へ！');
    batter.style.transition='left 1.35s linear, top 1.35s linear';
    batter.style.left='49%'; batter.style.top='75%';
  });
  later(2420,()=>frame('run2','走る！'));
  later(2690,()=>frame('run3','走る！'));
  later(2960,()=>frame('run4','走る！'));
  later(3220,()=>{frame('run1','一塁へ！');batter.style.left='67%';batter.style.top='65%'});
  later(3580,()=>{caption.textContent='SAFE！';running=false});
}
function pause(){
  if(!running)return;
  clearTimers(); running=false; caption.textContent += '（停止）';
  const elapsed=Math.min(Date.now()-started,duration);
  progress.style.transition='none';
  progress.style.width=(elapsed/duration*100)+'%';
}
document.getElementById('play').addEventListener('click',play);
document.getElementById('pause').addEventListener('click',pause);
document.getElementById('reset').addEventListener('click',reset);
reset();
</script>
